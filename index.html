<style>
:root{
  --navy:#1E2867; --navy-2:#182054; --blue:#3B4FD8; --blue-2:#3343BE; --green:#0E9F6E; --amber:#F59E0B; --red:#DC2626; --purple:#7C3AED;
  --r-card:12px; --r-ctl:8px;
  --bg:#F7F8FA; --card:#FFFFFF; --ink:#111827; --ink-2:#374151; --muted:#6B7280; --line:#E5E7EB; --line-2:#D1D5DB; --soft:#F3F4F6;
  --tintA:#E8EBFA; --tintB:#E6F6EF; --tintC:#FEF3DE; --tintN:#F1E9FE;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(90deg,#1B2461 0%,#1E2867 55%,#26338A 100%);border-bottom:1px solid var(--navy-2);color:#fff}
.hbar{max-width:1480px;margin:0 auto;padding:0 16px;min-height:60px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:none;padding:10px 0}
.brand .logo{height:36px;padding:0 10px;border-radius:8px;background:#fff;display:flex;align-items:center}
.brand .logo img{height:22px;width:auto;display:block}
.brand .sep{width:1px;height:22px;background:rgba(255,255,255,.22)}
.brand .t1{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand .t2{font-size:11px;font-weight:500;letter-spacing:.04em;color:rgba(255,255,255,.62);white-space:nowrap}
nav{display:flex;gap:2px;align-self:stretch;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{height:60px;padding:0 10px;border:none;background:transparent;font-size:14px;font-weight:600;color:rgba(255,255,255,.66);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:#fff}
nav .pill{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.hright select,.hright input{height:34px;max-width:140px;border-radius:8px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;padding:0 10px;font-size:13px;font-weight:500}
.hright select option{color:var(--ink)}
.hright input[type=month]{color-scheme:dark}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block}
.conn.ok i{background:#34D399}.conn.err i{background:#F87171}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .15s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-2)}
.btn.white{background:#fff;border-color:#fff;color:var(--navy)}.btn.white:hover{background:#E2E6FA}
.btn.danger{color:var(--red);border-color:#FECACA}.btn.danger:hover{background:#FEF2F2}
.btn.danger.solid{background:var(--red);border-color:var(--red);color:#fff}.btn.danger.solid:hover{background:#B91C1C}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

main{max-width:1480px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card .head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .head h2{font-size:15px;font-weight:600}
.card .head .sub{font-size:12px;color:var(--muted)}
.card .head .spacer{margin-left:auto}
.card .body{padding:16px 18px}
.banner{background:#FFF7E6;border:1px solid #FDE2B3;color:#8A5A00;border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:#FEF2F2;border-color:#FECACA;color:#991B1B}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}

/* ======================== visual system v2 ======================== */
:root{
  --bg:#F4F6FB; --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --line:#E6E9F2; --line-2:#D5DAE6; --soft:#F1F4FA;
  --blue:#4252E8; --blue-2:#3442CC; --indigo-50:#EEF1FF;
  --shadow:0 1px 1px rgba(15,23,42,.03),0 2px 6px rgba(15,23,42,.05);
  --shadow-lg:0 2px 4px rgba(15,23,42,.04),0 12px 32px rgba(30,40,103,.10);
  --ring:0 0 0 3px rgba(66,82,232,.18);
}
body{background:
  radial-gradient(1200px 500px at 85% -120px, rgba(124,58,237,.08), transparent 60%),
  radial-gradient(900px 420px at -10% -80px, rgba(66,82,232,.09), transparent 60%),
  var(--bg); background-attachment:fixed; letter-spacing:-.003em}
h1,h2,h3{letter-spacing:-.02em}
::selection{background:#C7D2FE}

/* header: deep navy with a soft aurora and hairline glow */
header{background:
  radial-gradient(600px 160px at 78% -40px, rgba(124,58,237,.45), transparent 70%),
  radial-gradient(500px 140px at 20% 130%, rgba(66,82,232,.40), transparent 70%),
  linear-gradient(100deg,#141B4D 0%,#1B2461 45%,#24307E 100%) !important;
  border-bottom:1px solid rgba(255,255,255,.06) !important; box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(20,27,77,.18)}
.brand .logo{box-shadow:0 1px 2px rgba(0,0,0,.2),0 0 0 1px rgba(255,255,255,.4) inset}
#nav button{position:relative}
#nav button.on::after,#nav button[aria-current]::after{content:'';position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#A5B4FC,#C4B5FD)}

/* surfaces */
.card{border-color:var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card>.head{padding:16px 20px}
.btn{border-radius:10px;border-color:var(--line-2);font-weight:600}
.btn:hover{border-color:#B9C1D6;background:#FBFCFF}
.btn.primary{background:linear-gradient(180deg,#4F5FF0,#3E4DE0);border-color:#3442CC}
.btn.primary:hover{background:linear-gradient(180deg,#5767F2,#4352E4)}
.btn.voice{background:linear-gradient(120deg,#4F46E5 0%,#7C3AED 55%,#A855F7 100%);background-size:160% 100%;transition:background-position .4s ease}
.btn.voice:hover{background-position:100% 0}
input,select,textarea{border-radius:10px!important}
input:focus,select:focus,textarea:focus{outline:none;border-color:#8B97F4!important;box-shadow:var(--ring)}

/* greeting band */
.head.hello{background:
  radial-gradient(420px 120px at 100% 0, rgba(168,85,247,.10), transparent 70%),
  linear-gradient(180deg,#FBFCFF,#F6F7FE);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.head.hello h2{font-size:20px;font-weight:700}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6366F1;margin-bottom:2px}
.who .av{box-shadow:0 0 0 3px #fff,0 0 0 4px #E0E7FF}

/* KPI tiles: icon chip, accent edge, soft tint */
.kpi{border-radius:16px;padding:16px 18px 16px 18px;border-color:var(--line);background:#fff}
.kpi::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;border-radius:16px 0 0 16px;background:var(--acc,#4252E8);opacity:.85}
.kpi::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--acc-t,rgba(66,82,232,.10)),transparent 70%);pointer-events:none}
.kpi .ki{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--acc-t,rgba(66,82,232,.10));color:var(--acc,#4252E8)}
.kpi .ki svg{width:18px;height:18px}
.kpi .l{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.kpi .d{font-size:12px}
.k-blue{--acc:#4252E8;--acc-t:rgba(66,82,232,.10)}
.k-green{--acc:#059669;--acc-t:rgba(5,150,105,.11)}
.k-purple{--acc:#7C3AED;--acc-t:rgba(124,58,237,.10)}
.k-amber{--acc:#D97706;--acc-t:rgba(217,119,6,.12)}
.k-rose{--acc:#E11D48;--acc-t:rgba(225,29,72,.09)}
.kpi .spark{right:12px;bottom:10px}

/* coverage gauge: deeper, with a halo */
.gauge{background:
  radial-gradient(260px 200px at 50% 40%, rgba(165,180,252,.30), transparent 70%),
  linear-gradient(160deg,#141B4D 0%,#26338F 55%,#4252E8 100%) !important;border-radius:18px !important;box-shadow:0 12px 32px rgba(30,40,103,.28) !important}
.gauge .rv{text-shadow:0 2px 12px rgba(0,0,0,.25)}

/* chart cards */
.chart{border-radius:16px}
.chart h3,.chart .ch{font-weight:700}

/* tables */
.tw table thead th{background:#F7F8FC;color:#475569;font-weight:700;letter-spacing:.01em}
.tw table tbody tr{transition:background .12s ease}
.tw table tbody tr:hover td{background:#FAFBFF}

/* lines in the log form */
.line{background:linear-gradient(180deg,#FCFDFF,#F8F9FE)!important;border:1px solid var(--line)!important;border-radius:14px!important}
.line .seq{background:linear-gradient(135deg,#4F5FF0,#7C3AED)!important;box-shadow:0 2px 6px rgba(66,82,232,.35)}
.chip{border-radius:999px;background:#EEF1FF;border-color:#D7DCFB}

/* route card */
.route{border-radius:14px;background:linear-gradient(180deg,#F2FBF7,#ECFAF3);border-color:#C9EEDC}
.route .legs>span,.route .stop{border-radius:999px}

/* week strip */
.wd{border-radius:14px;background:#fff;box-shadow:var(--shadow)}
.wd.on{background:linear-gradient(180deg,#EEF1FF,#E4E8FF);border-color:#C7CEFB}
.wd.on .dc{color:#4252E8}
.wd.today{box-shadow:0 0 0 2px #4252E8 inset, 0 6px 14px rgba(66,82,232,.18)}

/* untouched chips */
.uchip{background:rgba(255,255,255,.8);backdrop-filter:blur(4px)}

/* empty states */
.empty{padding:40px 20px}
.empty .eart{display:block;width:120px;height:80px;margin:0 auto 10px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}

/* Go panel */
.ai{border-left:1px solid var(--line)!important;box-shadow:-20px 0 50px rgba(15,23,42,.16)!important}
.ai .aihead,.ai>header,.ai .head{background:linear-gradient(180deg,#FBFCFF,#F5F6FE)}
.msg.u{background:linear-gradient(135deg,#1E2867,#3442CC)!important;color:#fff;border-radius:16px 16px 4px 16px!important}
.msg.a{border-radius:16px 16px 16px 4px!important;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.aifab{background:linear-gradient(120deg,#4F46E5,#7C3AED 60%,#A855F7)!important;box-shadow:0 10px 28px rgba(91,75,224,.38)!important}
.aifab .spark{animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(18deg)}}

/* dialog */
.modal{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.dialog{border-radius:20px!important;box-shadow:0 24px 64px rgba(15,23,42,.28)!important}

/* toast */
.toast{background:rgba(15,23,42,.92)!important;backdrop-filter:blur(8px);border-radius:14px!important;box-shadow:0 12px 30px rgba(15,23,42,.30)!important}

.chiprow{display:flex;gap:8px;flex-wrap:wrap}

.tools{display:flex;align-items:center;gap:6px}

.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}

.daypill{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.dp{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:#EEF1FF;border:1px solid #D7DCFB;color:#1E2867;font-size:13.5px;cursor:pointer}
.dp b{font-weight:700}

.dp.off{cursor:default;opacity:.8}
details.untouched{margin:4px 0 12px;border:1px solid var(--line);border-radius:14px;background:#FBFCFF;overflow:hidden}

.wd .dd{font-size:15px;font-weight:700;color:var(--ink)}
.wd .dc{font-size:10px;font-weight:700;height:12px;color:var(--blue)}
.wd.on{background:#EEF2FF;border-color:#C7D2FE}
.wd.today{box-shadow:0 0 0 2px var(--blue) inset}
.wd.sun:not(.on){opacity:.55}
.wd:hover{border-color:var(--blue)}
.btn.ghost{background:transparent;border-style:dashed}
.keys{display:grid;gap:8px}
.keys div{display:flex;align-items:center;gap:12px}
.keys kbd{min-width:92px;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:#F3F4F6;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:6px 8px;text-align:center}
@media (max-width:520px){.wd{width:40px;height:54px}}
/* premium touches */
.btn,.fchip,.seg button,.chip button,.rowact button,.uchip{transition:transform .12s ease,background .15s ease,box-shadow .15s ease,border-color .15s ease}
.btn:active,.fchip:active,.uchip:active{transform:scale(.97)}
.btn.primary{box-shadow:0 1px 2px rgba(59,79,216,.25),0 4px 12px rgba(59,79,216,.18)}
.btn.primary:hover{box-shadow:0 2px 4px rgba(59,79,216,.28),0 8px 18px rgba(59,79,216,.22)}
.card{transition:box-shadow .2s ease}
.kpi:hover,.chart:hover{box-shadow:0 2px 6px rgba(16,24,40,.06),0 10px 24px rgba(16,24,40,.07)}
.route,.aiact,.placepick,.msg{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{animation:toastin .22s ease both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.line{transition:box-shadow .15s ease}
.line:focus-within{box-shadow:0 0 0 2px rgba(59,79,216,.18)}
.untouched{margin:4px 0 12px}
.uchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.uchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:1px dashed var(--line-2);background:#fff;font-size:12.5px;color:var(--ink-2);cursor:pointer;max-width:320px}
.uchip:hover{border-style:solid;border-color:var(--blue);color:var(--blue)}
.uchip .badge{height:16px;font-size:10px;padding:0 5px}
tr.aerow{cursor:pointer}
tr.aerow.sel td{background:#EEF2FF}
tr.aerow.sel td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.skel{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.sk{height:84px;border-radius:12px;background:linear-gradient(90deg,#EEF0F4 25%,#F7F8FA 50%,#EEF0F4 75%);background-size:400% 100%;animation:sh 1.4s ease infinite}
.sk.h{height:56px}.sk.w{height:220px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.who h2{text-transform:none}
@media print{header,.aifab,.ai,.fbar,.btn,.rowact,#banner,.toast,.modal{display:none!important}main{padding:0;max-width:none}.card{box-shadow:none;border-color:#ccc;break-inside:avoid}.kpis{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:1fr 1fr}.gauge{background:#1E2867!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}}
/* filters row */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{height:34px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:#fff;font-size:13px}
.filters input[type=search]{min-width:200px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.dialog{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog .head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;background:#fff;z-index:2}
.dialog .head h3{font-size:16px;font-weight:600}
.dialog .body{padding:18px 20px}
.dialog .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;z-index:2}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;align-items:center;gap:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast.show{display:flex}
.toast button{background:transparent;border:none;color:#93C5FD;font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.opp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.opp .cl{font-weight:600;font-size:14px}
.opp .tx{font-size:13px;color:var(--ink-2);white-space:pre-wrap}
.opp .mt{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.opp .mt .act{margin-left:auto;display:flex;gap:6px}
.rowact{display:flex;gap:4px}
.rowact button{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 7px;font-size:12px;font-weight:600;color:var(--blue)}
.rowact button:hover{background:var(--tintA)}
.rowact button.del{color:var(--red)}.rowact button.del:hover{background:#FEF2F2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.me{font-size:12px;color:rgba(255,255,255,.72)}
@media (max-width:700px){header{position:static}.hbar{gap:8px}.hright{gap:6px}.conn span{display:none}nav{width:100%;order:3;border-top:1px solid rgba(255,255,255,.12)}nav button{height:44px}.hright select{max-width:150px}}
@media (max-width:480px){.brand .sep,.brand .t1,.brand .t2{display:none}.brand .t2{display:none}main{padding:14px 12px 60px}.card .body{padding:12px}.kpi .v{font-size:22px}.charts{grid-template-columns:1fr}.chart .cv{height:220px}}
</style>
</head>

// Fuzzy name matching: AEs type "Dawn bread", "Parco", "M&P" — find the account they mean.
const STOPW = new Set(['ltd','limited','pvt','private','company','co','the','of','and','group','pakistan','pk','inc','corporation','corp','industries','industry','pvt.','ltd.']);
const toks = s => norm(s).split(' ').filter(w => w && !STOPW.has(w));
const bigrams = s => { const w = toks(s).join(' '); const out = new Set(); for (let i=0;i<w.length-1;i++) out.add(w.slice(i,i+2)); return out; };
function dice(a, b){ const A=bigrams(a), B=bigrams(b); if(!A.size||!B.size) return 0; let n=0; for (const x of A) if (B.has(x)) n++; return 2*n/(A.size+B.size); }
function tokenScore(q, name){ const qt=toks(q), nt=toks(name); if(!qt.length||!nt.length) return 0; const hit = qt.filter(x => nt.some(y => y===x || (x.length>=3 && y.startsWith(x)) || (y.length>=3 && x.startsWith(y)))).length; return hit/qt.length * (hit===nt.length ? 1 : 0.95); }
function acronyms(name){ const all = norm(name).split(' ').filter(Boolean); return new Set([toks(name).map(w=>w[0]).join(''), all.map(w=>w[0]).join('')]); }
function scoreName(q, name){
  const nq = norm(q), nn = norm(name); if (!nq) return 0;
  if (nq === nn) return 1;
  let s = Math.max(dice(q, name), tokenScore(q, name));
  if (nn.includes(nq) || toks(name).join(' ').includes(toks(q).join(' '))) s = Math.max(s, 0.85);
  const flat = nq.replace(/ /g,''); if (/^[a-z&]{2,6}$/.test(flat)) { const ac = acronyms(name); if (ac.has(flat)) s = Math.max(s, 0.9); else if (flat.length>=3 && [...ac].some(x => x.startsWith(flat))) s = Math.max(s, 0.8); } // "ffc", "nbc", "ogdcl"
  const par = /\(([^)]+)\)/.exec(String(name)); if (par && norm(par[1]) === nq) s = 1; // "(PRL)" in the account name

}

// Ranked candidates for a query: own book first, then everyone else's accounts; aliases count as exact.
function matchAccounts(q, ae){
  const seen = new Set(), out = [];
  const alias = aliasFor(q, ae);
  data.accounts.forEach(a => { const k = (a.ae===ae?'own':'oth') + '|' + norm(a.account); if (seen.has(k)) return; seen.add(k);
    let s = scoreName(q, a.account); if (alias && norm(alias)===norm(a.account)) s = 1;
    out.push({a, s, own: a.ae===ae}); });
  const own = new Set(out.filter(x=>x.own).map(x=>norm(x.a.account)));
  return out.filter(x => x.own || !own.has(norm(x.a.account))).sort((x,y) => (y.s + (y.own?0.08:0)) - (x.s + (x.own?0.08:0)) || x.a.account.localeCompare(y.a.account));
}

// Turns whatever went wrong into one plain sentence for the person using the app. Technical detail never reaches the screen.
let lastTechnical = '';
function friendly(err){
  if (err && err.friendly) return err.message; // already translated once
  lastTechnical = String((err && err.message) || err || '');
  const m = String((err && err.message) || err || '');
  if (navigator.onLine === false || /offline/i.test(m)) return 'You are offline — your visits are kept on this phone and will be sent automatically when you have signal.';
  if (/HTML_PAGE/.test(m)) return 'The TMC Go link is not set up for everyone yet. Ask an admin to set the Apps Script deployment to “Anyone”.';
  if (/APP_PAGE/.test(m)) return 'This link points at an older setup. Ask an admin to update the backend and deploy a new version.';
  if (/NOT_JSON|Unexpected token|JSON/i.test(m)) return 'The sheet replied with something unexpected. Try again in a moment; if it keeps happening, tell an admin.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Could not reach the sheet. Check your connection and try again.';
  if (/BUSY|lock timeout|another process was holding the lock/i.test(m)) return 'The sheet was busy saving for someone else. Please try again in a moment.';
  if (/^SIGNIN/.test(m)) return 'Please sign in.';
  if (/WEAKPIN/.test(m)) return 'The admin PIN is still the default or too simple. An admin must set a stronger one (at least 6 digits) in the sheet’s Settings tab first.';
  if (/photo could not be saved|photo is too large/i.test(m)) return m.replace(/^Error:\s*/,'');
  if (/NOTYOU/.test(m)) return 'You can only change your own visits.';
  if (/MANAGER_ONLY/.test(m)) return 'Only admins can do that.';
  if (/NOPIN/.test(m)) return 'That PIN isn’t right. Your starting PIN is 1234.';
  if (/No email on file|code was sent less than|not right or has expired|Too many tries|not on the team list|wait 15 minutes|PIN isn’t right|4–8 digits/i.test(m)) return m.replace(/^Error:\s*/,'');
  if (/admin pin/i.test(m)) return 'Wrong admin PIN.';
  if (/wrong pin|pin required/i.test(m)) return 'The backend is on an older version. Ask an admin to paste the latest Code.gs into Apps Script and deploy a new version.';
  if (/unknown action/i.test(m)) return 'The backend is on an older version and does not understand this request. Ask an admin to update Code.gs and deploy a new version.';
  if (/quota|rate ?limit|429/i.test(m)) return 'Google is busy right now. Wait a minute and try again.';
  if (/not found|could not find|could not locate|could not build the route|office address|no office/i.test(m)) return m.replace(/^Error:\s*/,'');
  if (/too long|does not look right|Enter |Choose |Add at least|needs a date|Type the purpose|already in the team|name missing|No AEs|Go is not approved|Gemini key|Gemini model|Gemini is busy|Go could not answer|A manager still needs/i.test(m)) return m;
  return 'Something went wrong and the change was not saved. Please try again.';
}
async function parseApi(resp){
  const text = await resp.text();
  const trimmed = text.trim();
  if (trimmed.startsWith('{') || trimmed.startsWith('[')) { try { return JSON.parse(trimmed); } catch(e) { throw new Error('NOT_JSON'); } }
  if (/accounts\.google\.com|ServiceLogin|You need access|Sign in/i.test(text)) throw new Error('HTML_PAGE');
  if (/<!DOCTYPE|<html/i.test(text)) throw new Error('APP_PAGE');
  throw new Error('NOT_JSON');
}
async function callApi(body, attempt){
  attempt = attempt || 0;
  try { return await callApiOnce(body); }
  catch (e) {
    if (attempt < 3 && /busy saving for someone else/i.test(e.message)) { await new Promise(r => setTimeout(r, 1200 * (attempt + 1) + Math.random() * 600)); return callApi(body, attempt + 1); }
    throw e;
  }
}
async function callApiOnce(body){
  if (ui.demo) return demoApi(body);
  body = Object.assign({}, body, {token: getTok()});
  let res;
  try {
    if (hasGs()) {
      res = await new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no).api(body));
    } else if (body.action === 'all') {
      res = await parseApi(await fetch(apiUrl() + (apiUrl().includes('?')?'&':'?') + 'action=all&token=' + encodeURIComponent(getTok()) + '&t=' + Date.now(), {cache:'no-store'}));
    } else {
      res = await parseApi(await fetch(apiUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)}));
    }
  } catch (e) { const err = new Error(friendly(e)); err.friendly = true; throw err; }
  if (res && res.status === 'ok') return res;
  if (res && /^SIGNIN/.test(res.message || '') && !/^(sendCode|verifyCode|managerSignIn|roster|signIn)$/.test(body.action)) { resetGo(); setTok(''); ui.session = null; ui.me = ''; setTimeout(() => signInScreen(), 0); }
  const err2 = new Error(friendly((res && res.message) || 'Request failed')); err2.friendly = true; throw err2;
}

const DEMO_PINS = ['0000', '482913'];   // demo only — the live app checks the PIN in the sheet
function demoApi(b){
  const tabs = {upsertVisit:'visits', deleteVisit:'visits', upsertAccount:'accounts', deleteAccount:'accounts', upsertOpportunity:'opportunities', deleteOpportunity:'opportunities'};
  if (b.action === 'all') return {status:'ok', data: JSON.parse(JSON.stringify(data))};
  if (b.action === 'upsertAE') { const i=data.aes.findIndex(a=>a.name===b.row.name); if (i<0 && !DEMO_PINS.includes(String(b.adminPin||''))) throw new Error('Wrong admin PIN'); if (i>=0 && b.row.notes !== undefined && String(b.row.notes||'') !== String(data.aes[i].notes||'') && !DEMO_PINS.includes(String(b.adminPin||''))) throw new Error('Wrong admin PIN'); const row={...b.row, active: i<0 ? 'Y' : data.aes[i].active}; if(i<0) data.aes.push(row); else data.aes[i]=row; return {status:'ok', row}; }
  if (['checkAdmin','removeAE','restoreAE','setSettings'].includes(b.action)) {
    if (!DEMO_PINS.includes(String(b.adminPin||''))) throw new Error('Wrong admin PIN');
    if (b.action === 'checkAdmin') return {status:'ok'};
    if (b.action === 'setSettings') { Object.keys(b.settings||{}).forEach(k => { if (k==='autoKm') data.settings.autoKm=b.settings[k]; else if (k==='purposes') data.settings.purposes=b.settings[k]; else if (k.startsWith('office.')) { data.settings.offices[k.slice(7)] = {address:b.settings[k], latlng:''}; } }); return {status:'ok', offices:{}, settings: data.settings}; }
    const a = data.aes.find(x=>x.name===b.name); if (!a) throw new Error('AE not found'); a.active = b.action==='removeAE' ? 'N' : 'Y'; return {status:'ok', row:a};
  }
  if (b.action === 'upsertAlias') { const row={alias:b.alias, account:b.account, ae:b.ae}; if (!data.aliases.some(x=>norm(x.alias)===norm(row.alias)&&x.ae===row.ae)) data.aliases.push(row); return {status:'ok', row}; }
  const t = tabs[b.action]; if (!t) throw new Error('Unknown action');
  if (b.action.startsWith('delete')) { const i=data[t].findIndex(r=>r.id===b.id); if(i>=0) data[t].splice(i,1); return {status:'ok'}; }
  const row = {...b.row}; if(!row.id) row.id = uid(t[0].toUpperCase());
  const i = data[t].findIndex(r=>r.id===row.id); if(i<0) data[t].push(row); else data[t][i]=row;
  return {status:'ok', row};
}

function parseLatLng(text){

       || /!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/.exec(s)                 // place URLs
       || /^\s*(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/.exec(s);       // plain "31.52, 74.35"

function attachPicker(inp, menu, ae, accts, onPick){

async function saveVisit(){
  const msg = $('#fMsg'); msg.textContent='';
  form.lines.forEach(l => l.err = false);
  const lines = form.lines.filter(l => lineClient(l));
  const orphan = form.lines.filter(l => !lineClient(l) && linePurpose(l));
  if (orphan.length) { orphan.forEach(l => l.err = true); renderLog(); return $('#fMsg').textContent = 'A line has a purpose but no client — pick the client or remove the line.'; }
  if (!lines.length) { form.lines[0].err = true; renderLog(); return $('#fMsg').textContent = 'Add at least one client.'; }
  if (lines.some(l => !l.date)) return msg.textContent = 'Every line needs a date.';
  if (lines.some(l => l.purpose==='other' && !l.other.trim())) return msg.textContent = 'Type the purpose on the line marked “Other”.';
  const city = aeCities(ui.me)[0] || '';
  if (!city) return msg.textContent = 'Your city is not set — ask an admin to add it in the AEs tab of the sheet.';
  const auto = autoKmOn();
  // group by date
  const byDate = {}; lines.forEach(l => { const loc = lineLoc(l); (byDate[l.date] = byDate[l.date] || []).push({client: lineClient(l), purpose: linePurpose(l), lat: loc ? loc.lat : undefined, lng: loc ? loc.lng : undefined, addr: loc ? (loc.address||'') : ''}); });
  const dates = Object.keys(byDate).sort();
  const btn = $('#fSave'); btn.disabled = true; $('#fAdd').disabled = true;
  form.results = []; let newAny = false, failed = 0, okDays = 0, totalKm = 0;
  for (const date of dates) {
    ui.routeBusy = dates.length>1 ? fmtDate(date) : true; renderRouteBox();
    try {
      const ex = form.editId ? data.visits.find(v=>v.id===form.editId) : dayEntry(ui.me, date);
      const details = (form.editId ? [] : (ex ? dayDetails(ex) : [])).concat(byDate[date]);
      const accounts = details.map(d=>d.client);
      const newAccts = [...new Set(accounts.filter(n => !accountRow(ui.me, n) && !ownerOf(n)).map(n=>n.trim()))];
      for (const n of newAccts) { const a = await callApi({action:'upsertAccount', row:{id:null, ae:ui.me, account:n, tier:'', city, netNew:'Y', addedOn:date, notes:'Added from visit log'}}); upsertLocal('accounts', normAccounts([a.row])[0]); newAny = true; }
      details.forEach(d => { d.cat = catFor(ui.me, d.client); });
      form.lines.filter(l => l.date===date && wasCorrected(l) && l.typed.length >= 3).forEach(l => learnAlias(l.typed, l.client, ui.me));
      const purpose = [...new Set(details.map(d=>d.purpose).filter(Boolean))].join('; ');
      const manualKm = (form.kmByDate||{})[date];
      const row = {id: ex ? ex.id : null, date, ae: ui.me, city: (ex && ex.city) || city, note: (ex && ex.note) || '', accounts: accounts.join('; '), count: accounts.length, km: auto ? 0 : (manualKm !== undefined && manualKm !== '' ? Number(manualKm) : (ex && ex.km !== '' ? ex.km : '')), purpose, details: JSON.stringify(details), loggedBy: ui.me, ts: new Date().toISOString(), route: auto ? '' : (ex && ex.route) || '', kmMode: auto ? 'auto' : 'manual'};
      const res = await callApi({action:'upsertVisit', row, autoKm: auto});
      upsertLocal('visits', normVisits([res.row])[0]);
      okDays++; if (res.route) totalKm += res.route.totalKm;
      form.results.push({date, count: accounts.length, route: res.route || null, pending: res.pending || null});
      if (res.route && res.route.missing && res.route.missing.length) form.results[form.results.length-1].missing = res.route.missing;
    } catch(e) { failed++; form.results.push({date, error: friendly(e)}); if (navigator.onLine === false) { try { localStorage.setItem('vi.outbox.'+ui.me, '1'); } catch(x){} } }
  }
  ui.routeBusy = false;
  if (auto && newAny) { try { const d = (await callApi({action:'all'})).data; if (d && d.accounts) data.accounts = normAccounts(d.accounts); } catch(e){} }
  const nVisits = lines.length;
  toast(failed ? `${okDays} day${okDays===1?'':'s'} saved, ${failed} failed — see below` : `${nVisits} visit${nVisits===1?'':'s'} saved${auto && totalKm ? ` · ${num(totalKm)} km by road` : ''}`);
  if (!failed) { try { navigator.vibrate && navigator.vibrate(12); } catch(e){} milestoneCheck(); }
  if (monthOf(dates[0]) !== ui.month) setMonth(monthOf(dates[0]));
  const results = form.results;
  if (failed) { form.lines = form.lines.filter(l => results.some(r => r.error && r.date===l.date)); }
  else { form = {ae: ui.me, editId: null, lines: [newLine(dates[dates.length-1])], results, kmByDate:{}}; clearDraft(); }
  if (failed) form.results = results;
  renderLog();
}

function sparkline(vals){
  if (!vals || vals.length < 2) return '';
  const w = 120, h = 28, max = Math.max(...vals, 1);
  const pts = vals.map((v,i) => [i/(vals.length-1)*w, h - (v/max)*(h-4) - 2]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#sg)" opacity=".35"/><path d="${d}" fill="none" stroke="#3B4FD8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3B4FD8"/><stop offset="1" stop-color="#3B4FD8" stop-opacity="0"/></linearGradient></defs></svg>`;
}

function downloadCsv(name, rows){
  const csv = rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch(e) { toast('Download is not available in this preview'); }
}

function drawCharts(rows, total, mv, x){

  const dlOff = { display:false };

  const meas = rows.filter(r=>r.measured), ml = meas.map(r=>shortName(r.ae)), al = rows.map(r=>shortName(r.ae));

  mk('cGauge', {type:'doughnut', data:{datasets:[{data:[pctV, Math.max(0,100-pctV)], backgroundColor:['#34D399', 'rgba(255,255,255,.16)'], hoverBackgroundColor:['#34D399', 'rgba(255,255,255,.16)'], borderWidth:0, borderRadius:20, spacing:0}]}, options:{cutout:'80%', rotation:-90, responsive:true, maintainAspectRatio:false, plugins:{legend:legend(false), tooltip:{enabled:false}, datalabels:dlOff}, animation:{duration:900, easing:'easeOutQuart'}, events:[]}});

// Square-crop and shrink a photo to a ~6 KB JPEG data URL so it fits comfortably in a sheet cell.
function shrinkPhoto(file){
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { try { const S = 112, c = document.createElement('canvas'); c.width = S; c.height = S; const x = c.getContext('2d'); const m = Math.min(img.width, img.height); x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S); let q = 0.82, out = c.toDataURL('image/jpeg', q); while (out.length > 12000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); } URL.revokeObjectURL(url); resolve(out); } catch(e) { reject(e); } };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

// Escapes first, then the little markdown Go uses (bold, bullets, line breaks).
function mdLite(s){
  const e = esc(s); const lines = e.split('\n'); let html = '', inList = false;
  lines.forEach(l => { const m = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(l); if (m) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + m[1] + '</li>'; } else { if (inList) { html += '</ul>'; inList = false; } if (l.trim()) html += '<p>' + l + '</p>'; } });
  if (inList) html += '</ul>';

}

  if (!hd && rows.length && importDate(rows[0][0])) hd = {row: -1, col: {date: 0, client: 1, purpose: rows.some(r => r.length > 2) ? 2 : undefined}};   // no header: Date, Client, Purpose
  if (!hd) { out.innerHTML = `<div class="banner err">I couldn’t find a <b>Date</b> and a <b>Client</b> column in the first rows. <a href="#" id="impTpl2">Download the template</a> to see the layout.</div>`; $('#impTpl2').onclick = e => { e.preventDefault(); importTemplate(); }; return; }
  const body = rows.slice(hd.row + 1).slice(0, IMPORT_MAX), c = hd.col, items = [], bad = [], seenRows = new Set();
  const team = new Map(activeAEs().map(a => [norm(a.name), a.name]));
  body.forEach((r, i) => {
    const line = hd.row + i + 2, client = String(r[c.client] ?? '').trim().replace(/\s+/g,' ').slice(0, 120);
    if (!client && !String(r[c.date] ?? '').trim()) return;
    const date = importDate(r[c.date]);
    let ae = ui.me;
    if (c.ae !== undefined && String(r[c.ae] ?? '').trim()) { const n = norm(r[c.ae]); ae = team.get(n) || (activeAEs().find(a => norm(a.name).startsWith(n) || n.startsWith(norm(a.name))) || {}).name || ''; }
    const why = !client ? 'no client' : !date ? `date “${esc(String(r[c.date]))}” not understood` : date > todayIso() ? 'date is in the future' : !ae ? `AE “${esc(String(r[c.ae]))}” is not on the team` : (ae !== ui.me && !isMgr()) ? 'only admins can upload for someone else' : '';
    if (why) { bad.push({line, why}); return; }
    const best = matchAccounts(client, ae)[0], matched = best && best.s >= 0.6 ? best.a.account : client;
    const ex = dayEntry(ae, date), dupKey = ae + '|' + date + '|' + norm(matched);
    if ((ex && dayDetails(ex).some(d => norm(d.client) === norm(matched))) || seenRows.has(dupKey)) { bad.push({line, why: `${esc(matched)} is already logged for ${fmtLong(date)}${ae !== ui.me ? ' (' + esc(ae) + ')' : ''}`, dup: true}); return; }
    seenRows.add(dupKey);
    items.push({line, date, ae, typed: client, client: matched, corrected: norm(matched) !== norm(client), isNew: !(best && best.s >= 0.6), purpose: String(r[c.purpose] ?? '').trim().slice(0, 120), order: Number(r[c.order]) || (i + 1)});
  });
  const groups = new Map();
  items.forEach(x => { const k = x.ae + '|' + x.date; if (!groups.has(k)) groups.set(k, {ae: x.ae, date: x.date, rows: []}); groups.get(k).rows.push(x); });
  const days = [...groups.values()].sort((a, b) => a.date.localeCompare(b.date) || a.ae.localeCompare(b.ae));
  days.forEach(d => d.rows.sort((a, b) => a.order - b.order || a.line - b.line));
  ui.importDays = days;
  const people = new Set(days.map(d => d.ae)).size;
  out.innerHTML = `
    <div class="imp-sum"><b>${items.length}</b> visit${items.length===1?'':'s'} · <b>${days.length}</b> day${days.length===1?'':'s'}${people > 1 ? ` · <b>${people}</b> people` : ''}${bad.filter(b=>b.dup).length ? ` · <span class="hint">${bad.filter(b=>b.dup).length} already logged</span>` : ''}${bad.filter(b=>!b.dup).length ? ` · <span class="imp-bad">${bad.filter(b=>!b.dup).length} row${bad.filter(b=>!b.dup).length===1?'':'s'} skipped</span>` : ''}</div>
    ${bad.length ? `<details class="imp-skip"><summary>Rows not added (${bad.length})</summary><ul>${bad.slice(0,30).map(b => `<li>Row ${b.line}: ${b.why}</li>`).join('')}${bad.length>30?`<li>…and ${bad.length-30} more</li>`:''}</ul></details>` : ''}
    <div class="imp-days">${days.slice(0, 60).map(d => { const ex = dayEntry(d.ae, d.date); return `<div class="imp-day"><div class="imp-dh"><b>${fmtLong(d.date)}</b>${people > 1 || d.ae !== ui.me ? ` · ${esc(d.ae)}` : ''}${ex ? ` <span class="hint">· added to ${ex.count} already logged</span>` : ''}</div><ol>${d.rows.map(x => `<li><b>${esc(x.client)}</b>${x.purpose ? ` <span class="hint">· ${esc(x.purpose)}</span>` : ''}${x.isNew ? ' <span class="badge None">new client</span>' : x.corrected ? ` <span class="hint">(“${esc(x.typed)}”)</span>` : ''}</li>`).join('')}</ol></div>`; }).join('')}${days.length > 60 ? `<p class="hint">…and ${days.length - 60} more days.</p>` : ''}</div>
    ${items.length ? `<label class="switch" style="margin:10px 0 4px"><input type="checkbox" id="impKm" ${String(data.settings.autoKm||'Y').toUpperCase()!=='N'?'checked':''}> Work out kilometres from Google Maps (office → visits in order → office)</label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button type="button" class="btn primary" id="impGo">Save ${items.length} visit${items.length===1?'':'s'}</button></div>` : '<div class="banner err">Nothing to import.</div>'}`;
  if ($('#impGo')) $('#impGo').onclick = importSave;
}
async function importSave(){
  const days = ui.importDays || [], go = $('#impGo'), auto = $('#impKm') && $('#impKm').checked;
  go.disabled = true; let done = 0, failed = 0, visits = 0, km = 0; const errs = [];
  for (const d of days) {
    go.textContent = `Saving ${done + 1} of ${days.length} days…`;
    const ex = dayEntry(d.ae, d.date), prev = ex ? dayDetails(ex) : [];
    const details = prev.concat(d.rows.map(x => ({client: x.client, purpose: x.purpose, cat: catFor(d.ae, x.client)})));
    const a = aeByName(d.ae) || {}, city = String(a.city || '').split('/')[0].trim();
    const row = {id: ex ? ex.id : null, date: d.date, ae: d.ae, city, accounts: details.map(x => x.client).join('; '), count: details.length, purpose: [...new Set(details.map(x => x.purpose).filter(Boolean))].join('; '), loggedBy: ui.me, details: JSON.stringify(details)};
    try {
      const r = await callApi({action:'upsertVisit', row, autoKm: auto});
      upsertLocal('visits', normVisits([r.row])[0]); visits += d.rows.length; if (r.route) km += r.route.totalKm || 0;
      // brand-new clients join the person's book as net new, exactly like the form
      for (const x of d.rows.filter(y => y.isNew && !accountRow(d.ae, y.client))) { try { const ra = await callApi({action:'upsertAccount', row:{ae: d.ae, account: x.client, tier:'', city, netNew:'Y', addedOn: d.date}}); upsertLocal('accounts', normAccounts([ra.row])[0]); } catch(e){} }
    } catch(e) { failed++; errs.push(`${fmtLong(d.date)}${d.ae !== ui.me ? ' · ' + d.ae : ''}: ${e.message}`); }
    done++;
  }
  ui.importDays = null;
  $('#impOut').innerHTML = `<div class="banner${failed ? ' err' : ''}">${failed ? `Saved ${done - failed} of ${days.length} days. ` : ''}<b>${visits}</b> visit${visits===1?'':'s'} imported${km ? ` · <b>${num(km)}</b> km by road` : ''}.${errs.length ? `<ul>${errs.slice(0,10).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;
  toast(`${visits} visit${visits===1?'':'s'} imported${failed ? ` · ${failed} day${failed===1?'':'s'} failed` : ''}`);
  form = null; render(); if (!ui.demo) load(false);
}

/* ---------- Data check: what is really in the sheet, what each number means, and one-tap fixes ---------- */
function dataAudit(){
  const team = new Set(activeAEs().map(a => a.name)), months = new Map();
  const rows = data.visits.filter(v => v.date);
  rows.forEach(v => { if (!team.has(v.ae)) return; const m = v.date.slice(0,7), o = months.get(m) || {days:0, visits:0, km:0, people:new Set()}; const n = splitAccts(v.accounts).length; o.km += Number(v.km)||0; if (n) { o.days++; o.visits += n; o.people.add(v.ae); } months.set(m, o); });   // km includes travel days without client visits, as the dashboard does
  const today = todayIso().slice(0,7), recent = []; for (let i = 5; i >= 0; i--) { const d = new Date(+today.slice(0,4), +today.slice(5,7)-1-i, 1); recent.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); }
  const monthList = [...new Set([...recent, ...months.keys()])].sort().reverse();
  const repeats = rows.map(v => { const c = {}; splitAccts(v.accounts).forEach(n => { const k = norm(n); c[k] = (c[k]||0) + 1; }); const extra = Object.values(c).reduce((s,x)=>s+Math.max(0,x-1),0); return extra ? {v, extra} : null; }).filter(Boolean);
  const miscount = rows.filter(v => Number(v.count) !== splitAccts(v.accounts).length);
  const bookDup = []; const seen = new Map(); data.accounts.forEach(a => { const k = a.ae + '|' + norm(a.account); seen.set(k, (seen.get(k)||[]).concat(a)); }); seen.forEach(list => { if (list.length > 1) bookDup.push(list); });
  const kmCheck = rows.filter(v => splitAccts(v.accounts).length && (v.kmMode === 'pending' || Number(v.km) > 300));
  const strangers = rows.filter(v => !team.has(v.ae));
  const future = rows.filter(v => v.date > todayIso());
  const unmatched = new Map(); rows.forEach(v => splitAccts(v.accounts).forEach(n => { if (!accountRow(v.ae, n) && !accountRow('', n)) unmatched.set(norm(n), n); }));
  return {months, monthList, repeats, miscount, bookDup, kmCheck, strangers, future, unmatched};
}
async function dataCheckDialog(){
  const a = dataAudit();
  const issue = (n, title, body, fix) => `<div class="dc-issue ${n ? 'warn' : 'ok'}"><div class="dc-h"><span class="dc-n">${n ? n : '✓'}</span><b>${title}</b>${n && fix ? `<button type="button" class="btn sm primary" data-fix="${fix}">Fix</button>` : ''}</div>${n && body ? `<div class="dc-b">${body}</div>` : ''}</div>`;
  openModal('Check the numbers', `
    <div class="dc">
      <p class="hint" style="margin:0 0 10px">Straight from the sheet — every visit row, counted the same way the dashboard counts it.</p>
      <div class="tw"><table class="dc-m"><thead><tr><th>Month</th><th class="num">Days logged</th><th class="num">Visits</th><th class="num">Km</th><th class="num">People</th></tr></thead><tbody>
        ${a.monthList.map(m => { const o = a.months.get(m); return `<tr class="${o && o.visits ? '' : 'dc-empty'}"><td><b>${MONTHS_LONG[+m.slice(5)-1]} ${m.slice(0,4)}</b></td>${o && o.visits ? `<td class="num">${o.days}</td><td class="num">${o.visits}</td><td class="num">${num(o.km,0)}</td><td class="num">${o.people.size}</td>` : `<td colspan="4" class="hint">nothing logged</td>`}</tr>`; }).join('')}
      </tbody></table></div>
      <h4>Things that change the numbers</h4>
      ${issue(a.repeats.reduce((s,x)=>s+x.extra,0), 'Same client logged twice on the same day', a.repeats.slice(0,8).map(x => `${fmtLong(x.v.date)} · ${esc(x.v.ae)}`).join('<br>') + (a.repeats.length > 8 ? '<br>…' : ''), 'repeats')}
      ${issue(a.miscount.length, 'Days whose visit count doesn’t match the clients listed', a.miscount.slice(0,8).map(v => `${fmtLong(v.date)} · ${esc(v.ae)}: says ${v.count}, lists ${splitAccts(v.accounts).length}`).join('<br>'), 'recount')}
      ${issue(a.bookDup.length, 'Accounts listed twice in someone’s book', a.bookDup.slice(0,10).map(l => `${esc(l[0].ae)}: ${esc(l[0].account)} ×${l.length}`).join('<br>') + '<br><span class="hint">The dashboard now counts each once. To tidy the sheet, delete the extra row in the <b>Categories</b> tab.</span>', '')}
      ${issue(a.kmCheck.length, 'Days with kilometres to check (pending, or over 300 km)', a.kmCheck.slice(0,8).map(v => `${fmtLong(v.date)} · ${esc(v.ae)}: ${v.kmMode === 'pending' ? 'pending' : num(v.km) + ' km'}`).join('<br>'), 'km')}
      ${issue(a.strangers.length, 'Visits by people who aren’t on the team (left out of every figure)', [...new Set(a.strangers.map(v => v.ae))].map(esc).join(', '), '')}
      ${issue(a.future.length, 'Visits dated in the future', a.future.slice(0,6).map(v => `${esc(v.date)} · ${esc(v.ae)}`).join('<br>'), '')}
      <div class="dc-issue info"><div class="dc-h"><span class="dc-n">${a.unmatched.size}</span><b>Clients not in anyone’s book</b></div><div class="dc-b">${[...a.unmatched.values()].slice(0,12).map(esc).join(', ')}${a.unmatched.size > 12 ? ', …' : ''}<br><span class="hint">They count as net-new visits. If one is really an existing account under another spelling, add the spelling in the <b>Aliases</b> tab.</span></div></div>
      <details class="dc-def"><summary>How each number is worked out</summary><ul>
        <li><b>Visits</b> — every client listed on a day, for the people and dates selected.</li>
        <li><b>Visit days</b> — days with at least one visit, counted per person (two people on the same date = 2). <b>Dates</b> — different calendar dates.</li>
        <li><b>Accounts visited</b> — different accounts each person visited (spellings and aliases of the same account count once).</li>
        <li><b>Coverage</b> — A/B/C accounts in each person’s book with at least one visit, ÷ all their A/B/C accounts. People marked “no fixed book” and admins without visits are left out.</li>
        <li><b>Net new</b> — visits to accounts outside the A/B/C book.</li>
        <li><b>Kilometres</b> — the day totals saved with each day (Google Maps or entered by hand); <b>per visit</b> = km ÷ visits.</li>
      </ul></details>
    </div>`, null, 'Close');
  $$('button[data-fix]').forEach(b => b.onclick = () => dataFix(b.dataset.fix, b));
}
async function dataFix(kind, btn){
  const a = dataAudit(); btn.disabled = true; let done = 0, failed = 0;
  const list = kind === 'repeats' ? a.repeats.map(x => x.v) : kind === 'recount' ? a.miscount : a.kmCheck;
  if (!(await confirmModal(kind === 'repeats' ? `Remove ${a.repeats.reduce((s,x)=>s+x.extra,0)} repeated visits?` : kind === 'recount' ? `Recount ${list.length} days?` : `Recalculate kilometres for ${list.length} days?`,
      kind === 'repeats' ? 'On each affected day the client is kept once (the first time it appears); that day’s kilometres are recalculated.' : kind === 'recount' ? 'Each day’s visit count is set to the number of clients actually listed.' : 'Kilometres are worked out again from Google Maps, in the order of the visits.', 'Go ahead'))) { btn.disabled = false; return; }
  for (const v of list) {
    btn.textContent = `Fixing ${done + failed + 1} of ${list.length}…`;
    try {
      let row = {...v}, autoKm = false;
      if (kind === 'repeats') { const seen = new Set(); const det = dayDetails(v).filter(d => { const k = norm(d.client); if (seen.has(k)) return false; seen.add(k); return true; }); row.details = JSON.stringify(det); row.accounts = det.map(d => d.client).join('; '); row.count = det.length; autoKm = String(data.settings.autoKm||'Y').toUpperCase() !== 'N'; }
      if (kind === 'recount') row.count = splitAccts(v.accounts).length;
      if (kind === 'km') { const r = await callApi({action:'recalcKm', id: v.id, adminPin:getAdminPin()}); upsertLocal('visits', normVisits([r.row])[0]); done++; continue; }
      const r = await callApi({action:'upsertVisit', row, autoKm, adminPin:getAdminPin()}); upsertLocal('visits', normVisits([r.row])[0]); done++;
    } catch(e) { failed++; }
  }
  toast(`${done} day${done===1?'':'s'} fixed${failed ? ` · ${failed} couldn’t be fixed` : ''}`); render(); dataCheckDialog();
}

/* ---------- Modal / toast ---------- */
// bodyHtml is built by the app itself; every value it interpolates is passed through esc() first.
function openModal(title, bodyHtml, onSave, saveLabel='Save'){
  $('#mTitle').textContent = title; $('#mBody').innerHTML = bodyHtml;
  $('#mFoot').innerHTML = onSave ? `<span class="hint" id="mErr" style="margin-right:auto"></span><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mSave">${saveLabel}</button>` : `<span class="hint" id="mErr" style="margin-right:auto"></span><button class="btn primary" id="mCancel">${saveLabel}</button>`;
  const m = $('#modal'); m.classList.add('open');
  const close = () => m.classList.remove('open');
  $('#mCancel').onclick = close;
  m.onclick = e => { if (e.target===m) close(); };
  if ($('#mSave')) $('#mSave').onclick = async () => { const b=$('#mSave'); b.disabled=true; $('#mErr').textContent=''; try { await onSave(); close(); } catch(e){ $('#mErr').textContent = e.message; } b.disabled=false; };
  const first = $('#mBody input, #mBody select, #mBody textarea'); if (first && title !== 'Settings') first.focus();
}
let toastT;
function toast(msg, actLabel, act){
  const t=$('#toast'), a=$('#toastAct'); $('#toastMsg').textContent = msg;
  a.style.display = actLabel ? '' : 'none'; a.textContent = actLabel||''; a.onclick = async () => { t.classList.remove('show'); try { await act(); } catch(e){ toast(e.message); } };
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), actLabel ? 10000 : 3500);
}

/* ============================ INIT ============================ */
function initMeSelect(){
  setHeaderAvatar();
  const meSel = $('#me');
  if (!ui.demo && ui.session) { meSel.innerHTML = `<option>${esc(ui.me)}</option>`; meSel.disabled = true; meSel.title = 'Signed in as ' + ui.me + (isMgr() ? ' (admin)' : ''); meSel.classList.add('locked'); return; }
  if (!activeAEs().some(a=>a.name===ui.me)) ui.me='';
  meSel.innerHTML = '<option value="">Select AE…</option>' + activeAEs().map(a=>`<option ${a.name===ui.me?'selected':''}>${esc(a.name)}</option>`).join('');
}
function initUi(){
  // month: current, or the latest month with data
  const cur = todayIso().slice(0,7);
  const months = [...new Set(data.visits.map(v=>monthOf(v.date)))].sort();
  ui.month = localStorage.getItem('vi.month') || (months.includes(cur) ? cur : (months[months.length-1] || cur));
  try { const saved = JSON.parse(localStorage.getItem('vi.range')||''); if (saved && saved.preset) setRange(saved.preset, saved.from, saved.to); } catch(e){}
  if (!localStorage.getItem('vi.range')) { if (months.includes(cur)) setRange('month'); else if (months.length) { const lm = months[months.length-1]; setRange('custom', lm+'-01', monthEnd(lm)); } else setRange('month'); }
  initMeSelect();
  $('#loading').style.display = 'none'; const sk = $('#skeleton'); if (sk) sk.remove();
  document.addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key==='Enter' && ui.tab==='log' && $('#fSave') && !$('#modal').classList.contains('open')) { e.preventDefault(); $('#fSave').click(); } });
  // Unsaved visits must survive neither a stray refresh nor a closed tab unnoticed.
  window.addEventListener('beforeunload', e => {
    const dirty = (form && !form.editId && form.lines.some(l => l.client));
    if (!dirty) return;
    e.preventDefault(); e.returnValue = '';
  });
  // Tell people plainly when the connection drops, instead of failing silently on the next save.
  window.addEventListener('offline', () => { if (!ui.demo) setConn('err', 'Offline'); });
  window.addEventListener('online', async () => {
    if (ui.demo) return; setConn('', 'Reconnecting'); await load(false);
    // anything that failed to save while offline goes out now, automatically
    try { if (ui.me && localStorage.getItem('vi.outbox.'+ui.me) && form && !form.editId && form.lines.some(l => l.client)) { localStorage.removeItem('vi.outbox.'+ui.me); toast('Back online — sending your saved visits…'); ui.tab = 'log'; render(); await saveVisit(); } } catch(e){}
  });
  $('#me').onchange = e => { ui.me = e.target.value; localStorage.setItem('vi.me', ui.me); form = null; ui.route = null; render(); };
  $$('#nav button').forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; localStorage.setItem('vi.tab', ui.tab); countUpArmed = true; render(); });
  $$('#tabbar button[data-tab]').forEach(b => b.onclick = () => { if (ai.open) aiCloseFn(); ui.tab = b.dataset.tab; localStorage.setItem('vi.tab', ui.tab); countUpArmed = true; render(); window.scrollTo({top:0, behavior:'smooth'}); });
  $('#tabbar button[data-go]').onclick = () => ai.open ? aiCloseFn() : aiOpen();
  $('#tabbar button[data-set]').onclick = () => settingsDialog();
  $('#btnSettings').onclick = settingsDialog;
  $('#hInstall').onclick = installApp;
  // while any dialog is open, the phone tab bar steps aside so Save / Cancel are always reachable
  const syncModal = () => document.body.classList.toggle('modal-open', $$('.modal').some(m => m.classList.contains('open')));
  $$('.modal').forEach(m => new MutationObserver(syncModal).observe(m, {attributes:true, attributeFilter:['class']}));
  initAi();
  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'') || (e.target && e.target.isContentEditable);
    if (typing || e.metaKey || e.ctrlKey || e.altKey || $('#modal').classList.contains('open') || $('#ask').classList.contains('open')) return;
    const go = tab => { ui.tab = tab; localStorage.setItem('vi.tab', tab); countUpArmed = true; render(); };
    if (e.key === 'l') { go('log'); setTimeout(() => { const i = $('#v-log input[id^="lin-"]'); if (i) i.focus(); }, 50); e.preventDefault(); }
    else if (e.key === 'd') { go('dash'); e.preventDefault(); }
    else if (e.key === '/' || e.key === 'g') { ai.open ? $('#aiIn').focus() : aiOpen(); e.preventDefault(); }
    else if (e.key === 'n' && ui.tab === 'log' && $('#fAdd')) { $('#fAdd').click(); e.preventDefault(); }
    else if (e.key === '?') { openModal('Keyboard shortcuts', `<div class="keys">${[['L','Log a visit'],['D','Dashboard'],['N','Another visit line'],['/ or G','Talk to Go'],['Ctrl + Enter','Save visits'],['Esc','Close a panel'],['?','This list']].map(([k,v]) => `<div><kbd>${k}</kbd><span>${v}</span></div>`).join('')}</div>`, null, 'Close'); e.preventDefault(); }
  });
  document.addEventListener('keydown', e => { if (e.key==='Escape') { $('#modal').classList.remove('open'); if (ai.open) aiCloseFn(); } });
  if (!ui.demo) {
    let tick = 0;
    setInterval(() => {
      tick++;
      const dashDue = ui.tab==='dash' && tick % 2 === 0;           // dashboard: every 30 s
      const logDue = ui.tab!=='dash' && tick % 4 === 0;            // log tab: every 60 s, only when not mid-entry
      const idle = !form || form.editId || !form.lines.some(l => l.client);
      if (document.hidden || $('#modal').classList.contains('open')) return;
      if (dashDue || (logDue && idle)) load(false);
    }, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.tab==='dash') load(false); });
  }
}
if (typeof load === 'function') load(true); else throw new Error('App1 did not load (load() is missing)');
