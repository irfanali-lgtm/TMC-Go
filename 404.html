<style>
:root{
  --navy:#1E2867; --navy-2:#182054; --blue:#3B4FD8; --blue-2:#3343BE; --green:#0E9F6E; --amber:#F59E0B; --red:#DC2626; --purple:#7C3AED;
  --r-card:12px; --r-ctl:8px;
  --bg:#F7F8FA; --card:#FFFFFF; --ink:#111827; --ink-2:#374151; --muted:#6B7280; --line:#E5E7EB; --line-2:#D1D5DB; --soft:#F3F4F6;
  --tintA:#E8EBFA; --tintB:#E6F6EF; --tintC:#FEF3DE; --tintN:#F1E9FE;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(90deg,#1B2461 0%,#1E2867 55%,#26338A 100%);border-bottom:1px solid var(--navy-2);color:#fff}
.hbar{max-width:1480px;margin:0 auto;padding:0 16px;min-height:60px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
nav{display:flex;gap:2px;align-self:stretch;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{height:60px;padding:0 10px;border:none;background:transparent;font-size:14px;font-weight:600;color:rgba(255,255,255,.66);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:transparent}

.hright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.hright select,.hright input{height:34px;max-width:140px;border-radius:8px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;padding:0 10px;font-size:13px;font-weight:500}
.hright select option{color:var(--ink)}
.hright input[type=month]{color-scheme:dark}
.brand{display:flex;align-items:center;gap:11px;flex:none;padding:10px 0;text-decoration:none;color:#fff}
.brand .blogo{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 13px 0 11px;border-radius:13px;background:linear-gradient(180deg,#fff,#F3F5FA);box-shadow:0 1px 2px rgba(0,0,0,.18)}
/* the TMC go logo (owner, 25 Oct): mark + lowercase go in Playfair Display + bold dot — same as the app icon */
.bmark{height:26px;width:auto;display:block;flex:none}
.bgo{position:relative;font:800 22px/1 'Playfair Display',Georgia,serif;letter-spacing:-.02em;color:#78B13A;padding-right:7px;margin-top:2px}
/* the assistant's name written like the logo: lowercase go in Playfair */
.ggo{font-family:'Playfair Display',Georgia,serif;font-weight:800;letter-spacing:-.01em}
/* a thin divider between the logo and the tabs (laptops; phones use the bottom bar) */
@media (min-width:761px){ .brand::after{content:'';align-self:center;width:1px;height:28px;margin-left:9px;background:rgba(255,255,255,.22);border-radius:1px} }
.bdot{position:absolute;right:0;top:3px;width:5px;height:5px;border-radius:50%;background:#8DC63F}
/* the dot is live: two soft rings keep rippling out of it (owner, 25 Oct) */
.bdot::before,.bdot::after{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid #8DC63F;opacity:0;animation:godot 2.4s cubic-bezier(.2,.6,.35,1) infinite}
.bdot::after{animation-delay:1.2s}
@keyframes godot{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.bdot::before,.bdot::after{animation:none}}
.brand .bword{display:flex;flex-direction:column;justify-content:center;gap:3px;line-height:1}
.brand .bsub{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;letter-spacing:.01em;text-transform:none;color:rgba(255,255,255,.62);white-space:nowrap}
.brand .blive{width:5px;height:5px;border-radius:50%;background:#34D399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:livepulse 2.4s ease-out infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@media (prefers-reduced-motion:reduce){.brand .blive{animation:none}}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block}
.conn.ok i{background:#34D399}.conn.err i{background:#F87171}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .15s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-2)}

.btn.danger{color:var(--red);border-color:#FECACA}.btn.danger:hover{background:#FEF2F2}
.btn.danger.solid{background:var(--red);border-color:var(--red);color:#fff}.btn.danger.solid:hover{background:#B91C1C}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

main{max-width:1480px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card .head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .head h2{font-size:15px;font-weight:600}
.card .head .sub{font-size:12px;color:var(--muted)}
.card .head .spacer{margin-left:auto}
.card .body{padding:16px 18px}
.banner{background:#FFF7E6;border:1px solid #FDE2B3;color:#8A5A00;border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:#FEF2F2;border-color:#FECACA;color:#991B1B}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hero .l,.kpi.hero .d{color:rgba(255,255,255,.7)}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#FAFBFF}
tr.total td{font-weight:700;background:var(--tintA);border-top:2px solid var(--navy)}
td.wrap{white-space:normal;min-width:200px;max-width:460px;overflow-wrap:anywhere}
.chip{max-width:min(100%,420px)}
.chip>span,.chip{overflow-wrap:anywhere}
.notebtn,.mnote,.hint{overflow-wrap:anywhere}
.kpi .v{overflow-wrap:anywhere}
.cov th.grp{text-align:center;background:#E9ECF8;color:var(--navy);border-left:1px solid var(--line-2)}
.cov td.gl,.cov th.gl{border-left:1px solid var(--line-2)}
.pct{display:inline-block;min-width:46px;text-align:right;padding:2px 7px;border-radius:6px;font-weight:600;font-variant-numeric:tabular-nums}
.pct.hi{background:var(--tintB);color:#047857}.pct.mid{background:var(--tintC);color:#B45309}.pct.lo{background:#FEE2E2;color:#B91C1C}.pct.na{background:var(--soft);color:var(--muted);font-weight:500}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.02em}
.badge.A{background:var(--navy);color:#fff}.badge.B{background:var(--tintA);color:var(--navy)}.badge.C{background:var(--tintC);color:#B45309}.badge.N{background:var(--tintN);color:#5B21B6}.badge.P{background:var(--soft);color:var(--ink-2)}.badge.O{background:#fff;border:1px solid var(--line-2);color:var(--muted)}
.badge.ok{background:var(--tintB);color:#047857}.badge.no{background:var(--soft);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;min-width:80px}

/* ======================== visual system v2 ======================== */
:root{
  --bg:#F4F6FB; --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --line:#E6E9F2; --line-2:#D5DAE6; --soft:#F1F4FA;
  --blue:#4252E8; --blue-2:#3442CC; --indigo-50:#EEF1FF;
  --shadow:0 1px 1px rgba(15,23,42,.03),0 2px 6px rgba(15,23,42,.05);
  --shadow-lg:0 2px 4px rgba(15,23,42,.04),0 12px 32px rgba(30,40,103,.10);
  --ring:0 0 0 3px rgba(66,82,232,.18);
}
body{background:
  radial-gradient(1200px 500px at 85% -120px, rgba(124,58,237,.08), transparent 60%),
  radial-gradient(900px 420px at -10% -80px, rgba(66,82,232,.09), transparent 60%),
  var(--bg); background-attachment:fixed; letter-spacing:-.003em}
h1,h2,h3{letter-spacing:-.02em}
::selection{background:#C7D2FE}

/* header: deep navy with a soft aurora and hairline glow */
header{background:
  radial-gradient(600px 160px at 78% -40px, rgba(124,58,237,.45), transparent 70%),
  radial-gradient(500px 140px at 20% 130%, rgba(66,82,232,.40), transparent 70%),

.who h2{text-transform:none}
@media print{header,.aifab,.ai,.fbar,.btn,.rowact,#banner,.toast,.modal{display:none!important}main{padding:0;max-width:none}.card{box-shadow:none;border-color:#ccc;break-inside:avoid}.kpis{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:1fr 1fr}.gauge{background:#1E2867!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}}
/* filters row */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}



/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.dialog{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog .head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;background:#fff;z-index:2}
.dialog .head h3{font-size:16px;font-weight:600}
.dialog .body{padding:18px 20px}
.dialog .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;z-index:2}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;align-items:center;gap:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast.show{display:flex}
.toast button{background:transparent;border:none;color:#93C5FD;font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.opp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.opp .cl{font-weight:600;font-size:14px}

.opp .mt{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.opp .mt .act{margin-left:auto;display:flex;gap:6px}
.rowact{display:flex;gap:4px}
.rowact button{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 7px;font-size:12px;font-weight:600;color:var(--blue)}
.rowact button:hover{background:var(--tintA)}
.rowact button.del{color:var(--red)}.rowact button.del:hover{background:#FEF2F2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.me{font-size:12px;color:rgba(255,255,255,.72)}
@media (max-width:700px){header{position:static}.hbar{gap:8px}.hright{gap:6px}.conn span{display:none}nav{width:100%;order:3;border-top:1px solid rgba(255,255,255,.12)}nav button{height:44px}.hright select{max-width:150px}}
@media (max-width:480px){.brand .bsub{display:none}main{padding:14px 12px 60px}.card .body{padding:12px}.kpi .v{font-size:22px}.charts{grid-template-columns:1fr}.chart .cv{height:220px}}
/* ════════════════════════════ TMC Go design system ════════════════════════════
   One source for colour, type, spacing, radius, elevation and motion. Everything below this line
   is component styling built only from these tokens; it sits last so every screen follows it. */
:root{
  /* brand */
  --b-950:#0E1440; --b-900:#141B4D; --b-800:#1C2566; --b-700:#2A3590; --b-600:#3B49D6; --b-500:#4F5CE6; --b-200:#C9CEF8; --b-100:#E3E6FC; --b-50:#F1F3FE;
  --leaf:#4CBF6B; --leaf-2:#2FA86F;                     /* the green of the TMC mark */
  /* neutrals */
  --n-0:#FFFFFF; --n-25:#FBFCFE; --n-50:#F5F6FA; --n-100:#EEF0F5; --n-200:#E4E7EF; --n-300:#D3D8E4; --n-400:#A9B0C2; --n-450:#8A92A5; --n-500:#636B7E; --n-600:#4B5468; --n-700:#2E3650; --n-900:#0F1629;
  /* meaning */
  --ok:#0E7553; --ok-bg:#E7F6EF; --warn:#9A5B05; --warn-bg:#FDF3DF; --bad:#C2372F; --bad-bg:#FDECEA; --info-bg:#EEF1FE;
  /* account categories */
  --cA:#1C2566; --cA-bg:#E6E9FA; --cB:#3B49D6; --cB-bg:#E9ECFE; --cC:#9A5B05; --cC-bg:#FDF1DC; --cN:#4B5468; --cN-bg:#EEF0F5;
  /* shape, depth, motion */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px;
  --sh-xs:0 1px 2px rgba(15,22,41,.05);
  --sh-sm:0 1px 2px rgba(15,22,41,.04),0 2px 8px rgba(15,22,41,.04);
  --sh-md:0 2px 4px rgba(15,22,41,.04),0 8px 24px rgba(15,22,41,.08);
  --sh-lg:0 4px 8px rgba(15,22,41,.06),0 24px 56px rgba(15,22,41,.18);
  --ease:cubic-bezier(.2,.8,.2,1); --t-fast:120ms; --t:180ms;
  --ring:0 0 0 3px rgba(59,73,214,.22);
  /* legacy names now point at the system */
  --navy:var(--b-800); --navy-2:var(--b-900); --blue:var(--b-600); --blue-2:var(--b-700); --green:var(--ok); --amber:#D69211; --red:var(--bad); --purple:var(--b-600);
  --bg:var(--n-50); --card:var(--n-0); --ink:var(--n-900); --ink-2:var(--n-700); --muted:var(--n-500); --line:var(--n-200); --line-2:var(--n-300); --soft:var(--n-100);
  --shadow:var(--sh-xs); --shadow-lg:var(--sh-lg); --r-card:var(--r-xl); --r-ctl:var(--r-md);
}
html body{background:var(--n-50);color:var(--n-900);font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body h1,body h2,body h3{letter-spacing:-.015em;color:var(--n-900)}
body .hint{color:var(--n-500)}
body .num,body .v,body td.num,body .rv{font-variant-numeric:tabular-nums}
::selection{background:var(--b-100)}
:focus-visible{outline:none}
body button:focus-visible,body a:focus-visible,body [tabindex]:focus-visible,body summary:focus-visible{outline:none;box-shadow:var(--ring)!important;border-radius:var(--r-md)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ── header ── */
body header{background:linear-gradient(180deg,var(--b-900),var(--b-800))!important;border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 1px 0 rgba(15,22,41,.04),0 6px 20px rgba(14,20,64,.18)}
body header .hbar{min-height:60px;gap:20px}
body .brand .blogo{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.18)}
body #nav{gap:4px}
body #nav button{height:60px;padding:0 14px;font-size:14px;font-weight:600;color:rgba(255,255,255,.62);border:0;background:none;transition:color var(--t) var(--ease)}
body #nav button:hover{color:rgba(255,255,255,.92)}
body #nav button.on{color:#fff}
body #nav button.on::after{left:14px;right:14px;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#B7E86A,var(--leaf))}
body .hright{gap:10px}
body .hright select{height:36px;border-radius:999px!important;border:1px solid rgba(255,255,255,.16)!important;background-color:rgba(255,255,255,.06)!important;color:#fff!important;font-weight:600;font-size:13.5px;padding:0 14px!important}
body .hib{width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--t) var(--ease)}
body .hib:hover{background:rgba(255,255,255,.14)}
body .hib .i{width:18px;height:18px}
body .hinstall{height:36px;border-radius:999px}

/* ── icons ── */
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── layout & cards ── */
body main{gap:20px}
body .card{background:var(--n-0);border:1px solid var(--n-200)!important;border-radius:var(--r-xl)!important;box-shadow:var(--sh-sm)!important}
body .card .head{padding:16px 20px;border-bottom:1px solid var(--n-100);gap:12px}
body .card .head h2{font-size:16px;font-weight:650}
body .card .body{padding:20px}
body .banner{border-radius:var(--r-lg);border:1px solid var(--n-200);background:var(--n-25);color:var(--n-700);padding:12px 14px;font-size:13.5px}
body .banner.err{background:var(--bad-bg);border-color:#F6C9C5;color:#8F241E}
body .banner.ok,body .allclear{background:var(--ok-bg);border-color:#BFE6D3;color:#0B5E43}
body .banner.mgr{background:var(--b-50);border-color:var(--b-200);color:var(--b-800)}

/* ── buttons ── */
body .btn{height:40px;min-height:40px;padding:0 16px;border-radius:var(--r-md)!important;font-size:14px;font-weight:600;letter-spacing:-.005em;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--n-300)!important;background:var(--n-0)!important;color:var(--n-700)!important;box-shadow:var(--sh-xs)!important;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);cursor:pointer;white-space:nowrap}
body .btn:hover{background:var(--n-50)!important;border-color:var(--n-400)!important}
body .btn:active{transform:translateY(1px)}
body .btn:disabled,body .btn[aria-disabled=true]{opacity:.55;cursor:not-allowed;transform:none}
body .btn.primary{background:var(--b-600)!important;border-color:var(--b-600)!important;color:#fff!important;box-shadow:0 1px 2px rgba(59,73,214,.25),inset 0 1px 0 rgba(255,255,255,.12)!important}
body .btn.primary:hover{background:var(--b-700)!important;border-color:var(--b-700)!important}
body .logextra{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px!important}
body .btn.quiet{background:transparent!important;border-color:transparent!important;box-shadow:none!important;color:var(--n-600)!important;height:36px;min-height:36px;padding:0 10px}
body .btn.quiet:hover{background:var(--n-50)!important;border-color:transparent!important;color:var(--n-900)!important}
body .btn.quiet .i{color:var(--b-600)}
body .btn.voice{background:var(--n-0)!important;color:var(--n-700)!important}
body .btn.sm{height:32px;min-height:32px;padding:0 12px;font-size:13px;border-radius:var(--r-sm)!important}

body .dellink{color:var(--bad);font-weight:600}

/* ── form controls ── */
body input[type=text],body input[type=search],body input[type=email],body input[type=tel],body input[type=password],body input[type=number],body input[type=date],body input[type=month],body input:not([type]),body select,body textarea{border:1px solid var(--n-300)!important;border-radius:var(--r-md)!important;background-color:var(--n-0);color:var(--n-900);font-size:14px;transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
body input:not([type=checkbox]):not([type=radio]):not([type=file]),body select{min-height:40px}
body input:hover:not(:disabled),body select:hover:not(:disabled),body textarea:hover:not(:disabled){border-color:var(--n-400)!important}
body input:focus,body select:focus,body textarea:focus{outline:none;border-color:var(--b-500)!important;box-shadow:var(--ring)!important}
body input::placeholder,body textarea::placeholder{color:var(--n-400)}
body label{color:var(--n-700)}
body .f>label{font-size:12.5px;font-weight:600;color:var(--n-600);margin-bottom:6px}

/* ── badges & pills ── */
body .badge{height:20px;padding:0 7px;border-radius:var(--r-xs);font-size:11px;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;border:0}
body .badge.A{background:var(--cA-bg);color:var(--cA)} body .badge.B{background:var(--cB-bg);color:var(--cB)} body .badge.C{background:var(--cC-bg);color:var(--cC)}
body .badge.None,body .badge.N,body .badge.O{background:var(--cN-bg);color:var(--cN)} body .badge.pend{background:var(--warn-bg);color:var(--warn)}
body .st.ok{background:var(--ok-bg);color:var(--ok)} body .st.due{background:var(--warn-bg);color:var(--warn)} body .st.miss{background:var(--bad-bg);color:var(--bad)}

/* ── dashboard toolbar ── */
body .fbar{background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--r-xl);box-shadow:var(--sh-sm);padding:10px 12px;gap:10px}
body .seg{background:var(--n-100);border-radius:var(--r-md);padding:3px;gap:2px;border:0}
body .seg button{height:32px;padding:0 12px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;color:var(--n-600);background:transparent;border:0;transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
body .seg button:hover{color:var(--n-900)}
body .seg button.on{background:var(--n-0);color:var(--b-800);box-shadow:var(--sh-xs),0 0 0 1px rgba(15,22,41,.04)}
body .fbar select,body .fbar input[type=date]{height:38px;min-height:38px}
body .ib{width:38px;height:38px;border-radius:var(--r-md);border:1px solid var(--n-200);background:var(--n-0);color:var(--n-600);display:inline-flex;align-items:center;justify-content:center;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
body .ib:hover{background:var(--n-50);color:var(--n-900)}
body .ib.on{background:var(--b-50);border-color:var(--b-200);color:var(--b-700)}
body .ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── team row ── */
body .fbar.aerow{padding:12px 14px}
body .story .av,body .story img.av{width:46px!important;height:46px!important;font-size:15px!important;box-shadow:0 0 0 2px var(--n-0),0 0 0 3.5px var(--n-200)!important;transition:box-shadow var(--t) var(--ease),transform var(--t) var(--ease)}
body .story:hover .av{transform:translateY(-1px)}
body .story.sel .av{box-shadow:0 0 0 2px var(--n-0),0 0 0 4px var(--b-600)!important}
body .story .sn,body .story>span:last-child{font-size:12px;font-weight:600;color:var(--n-600)}
body .story.sel .sn,body .story.sel>span:last-child{color:var(--b-700)}
body .story.all .av{background:var(--b-800)!important}

/* ── coverage hero ── */
body .card.gauge{background:radial-gradient(120% 90% at 20% 0%,#27318A 0%,var(--b-900) 60%)!important;border:0!important;box-shadow:var(--sh-md)!important;color:#fff}
body .card.gauge .gl{font-size:13px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:0}
body .card.gauge .rv{font-weight:700;letter-spacing:-.03em}
body .card.gauge .rl,body .card.gauge .rl2{color:rgba(255,255,255,.7)}

/* ── KPI cards: neutral, one accent where it means something ── */
body .kpi{background:var(--n-0)!important;border:1px solid var(--n-200)!important;border-left-width:1px!important;border-radius:var(--r-xl)!important;box-shadow:var(--sh-sm)!important;padding:18px 20px!important;overflow:hidden}
body .kpi::before,body .kpi::after{display:none!important}
body .kpi .l{padding-right:42px;font-size:13px!important;font-weight:600!important;color:var(--n-600)!important;letter-spacing:0!important;text-transform:none!important}
body .kpi .v{font-size:30px!important;font-weight:700!important;letter-spacing:-.03em!important;color:var(--n-900)!important;line-height:1.1!important;margin-top:6px}
body .kpi .d{font-size:12.5px!important;color:var(--n-500)!important;margin-top:4px}
body .kpi .ki{width:34px!important;height:34px!important;border-radius:var(--r-md)!important;background:var(--b-50)!important;color:var(--b-600)!important;box-shadow:none!important}
body .kpi.k-green .ki{background:var(--ok-bg)!important;color:var(--ok)!important}
body .kpi.k-rose .ki{background:var(--warn-bg)!important;color:var(--warn)!important}
body .kpi.k-rose .v{color:var(--n-900)!important}
body .kpi:hover{box-shadow:var(--sh-md)!important}

/* ── clickable cards & drill-down lists ── */
body .drillable{cursor:pointer;transition:box-shadow var(--t) var(--ease),transform var(--t) var(--ease),border-color var(--t) var(--ease)}
body .drillable:hover{box-shadow:var(--sh-md)!important;transform:translateY(-1px);border-color:var(--b-200)!important}
body .drillable:focus-visible{box-shadow:var(--ring)!important}
body .drillable::after{content:'›';position:absolute;right:14px;bottom:10px;color:var(--n-400);font-size:18px;line-height:1;display:block!important;background:none!important;width:auto!important;height:auto!important}
body .card.gauge.drillable::after{color:rgba(255,255,255,.55)}
body .modal .dialog.wide{max-width:min(1040px,96vw)!important;width:min(1040px,96vw)}
.drhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.drhead b{font-size:15px;white-space:nowrap}
.drbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.drbar input{flex:1;min-width:0}
.drl{max-height:60vh;overflow:auto;border:1px solid var(--n-200);border-radius:var(--r-lg)}
.drl table{min-width:100%;border-collapse:collapse}
.drl th{position:sticky;top:0;z-index:1}
.drl td,.drl th{padding:8px 10px;white-space:nowrap}
@media (max-width:760px){ .drl{max-height:none;border:0;border-radius:0;margin:0 -16px} .drl td,.drl th{padding:8px 8px} }
/* ── to-do & follow-ups ── */
body .todobtn{gap:6px}
body .todobtn.on{background:var(--b-50)!important;border-color:var(--b-200)!important;color:var(--b-800)!important}
.tcount{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--b-100);color:var(--b-800);font-size:12px;font-weight:700}
.tcount.over{background:var(--bad);color:#fff}
.overtxt{color:var(--bad)}
.todopanel .head{flex-wrap:nowrap;align-items:center}
.todopanel .head .sub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){ .todopanel .lbl-l{display:none} }
.tgroup+.tgroup{margin-top:14px}
.tg{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--n-500);margin-bottom:6px}
.tg span{color:var(--n-400);font-weight:600}
.todos{list-style:none;margin:0;padding:0}
.todo{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--n-100)}
.todo:first-child{border-top:0}
.todo.done .ttask{text-decoration:line-through;color:var(--n-500)}
.tdone{width:28px;height:28px;border-radius:999px;border:2px solid var(--n-300);background:var(--n-0);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.tdone svg{width:16px;height:16px;fill:none;stroke:var(--n-0);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tdone:hover{border-color:var(--ok);background:var(--ok-bg)}
.tdone:hover svg{stroke:var(--ok)}
.todo.done .tdone{background:var(--ok);border-color:var(--ok)}
.ttask{font-weight:600;color:var(--n-900);line-height:1.35;overflow-wrap:anywhere}
.tmeta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:3px;font-size:12.5px;color:var(--n-600);align-items:center}
.tdue{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-weight:600;background:var(--n-100);color:var(--n-600)}
.tdue.over{background:var(--bad-bg);color:var(--bad)} .tdue.today{background:var(--warn-bg);color:var(--warn)} .tdue.soon{background:var(--b-50);color:var(--b-700)}
.tnote{color:var(--n-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.tact{display:flex;gap:6px}
.tdonebox{margin-top:12px} .tdonebox summary{cursor:pointer;color:var(--n-500);font-size:13px;font-weight:600}
.fu2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;align-items:end;margin-top:8px} .chk{display:flex!important;align-items:center;gap:10px;min-height:40px;font-weight:500;cursor:pointer;margin:0!important}
body .chk input[type=checkbox]{width:18px!important;height:18px!important;min-height:0!important;min-width:0!important;flex:none;margin:0;padding:0;accent-color:var(--b-600);box-shadow:none!important}
@media (max-width:760px){ .tnote{max-width:100%;white-space:normal} .todo{grid-template-columns:30px minmax(0,1fr) auto} }
.fuquick{display:flex;flex-wrap:wrap;gap:6px}
.chipq{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--n-300);background:var(--n-0);font:inherit;font-size:13px;font-weight:600;color:var(--n-700);cursor:pointer}
.chipq:hover{border-color:var(--b-500);background:var(--b-50)} .chipq.on{background:var(--b-600);border-color:var(--b-600);color:#fff}
.fuhint{margin:10px 0 0;font-size:13px;color:var(--n-700);background:var(--n-50);border:1px solid var(--n-200);border-radius:var(--r-md);padding:10px 12px;line-height:1.45}
.funudge{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--b-50);border:1px solid var(--b-200);border-radius:var(--r-lg);padding:8px 12px;margin-bottom:8px;font-size:13.5px;color:var(--b-800)}
.logcard .todopanel{border:1px solid var(--n-200)!important;box-shadow:none!important;margin:0 0 14px}
/* ── to-do v2 ── */
body .todopanel{padding:0;overflow:hidden}
.tdhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.tdtitle{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap} .tdtitle h2{font-size:16px;margin:0}
.tdact{display:flex;align-items:center;gap:6px;flex:none}
.rempill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.rempill svg,.tdwarn svg,.tst svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rempill.on{background:var(--ok-bg);color:var(--ok)} .rempill.off{background:var(--warn-bg);color:var(--warn)}
.tdwarn{display:flex;gap:8px;align-items:flex-start;margin:0 16px 10px;padding:10px 12px;border-radius:var(--r-md);background:var(--warn-bg);color:#6B4204;font-size:13px;line-height:1.45}
.tdtabs{display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--n-100)} .tdtabs::-webkit-scrollbar{display:none}
.tdtab{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--n-600);cursor:pointer}
.tdtab span{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--n-100);color:var(--n-600);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center}
.tdtab:hover{background:var(--n-50)} .tdtab.on{background:var(--b-600);color:#fff} .tdtab.on span{background:rgba(255,255,255,.22);color:#fff}
.tdtab.alert:not(.on) span{background:var(--bad);color:#fff}
.tdbody{padding:6px 12px 12px}
.tdlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tditem{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px;border:1px solid var(--n-200);border-radius:var(--r-lg);background:var(--n-0);transition:box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
.tditem:hover{border-color:var(--b-200);box-shadow:var(--sh-sm)}
.tdtile{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;padding:6px 0;background:var(--n-50);color:var(--n-700);line-height:1.05;min-height:64px}
.tdw{font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.8} .tdd{font-size:20px;font-weight:800;letter-spacing:-.02em} .tdm{font-size:10px;font-weight:700;letter-spacing:.06em} .tdt{margin-top:3px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.k-over .tdtile{background:var(--bad-bg);color:var(--bad)} .k-today .tdtile{background:var(--warn-bg);color:var(--warn)} .k-soon .tdtile{background:var(--b-50);color:var(--b-700)} .k-done .tdtile{background:var(--ok-bg);color:var(--ok)}
.k-over{border-left:3px solid var(--bad)} .k-today{border-left:3px solid #D69211}
.tdtask{font-weight:650;color:var(--n-900);line-height:1.35;overflow-wrap:anywhere}
.k-done .tdtask{text-decoration:line-through;color:var(--n-500)}
.tdacc{margin-top:2px;font-size:13px;color:var(--n-700);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tdnote{margin-top:3px;font-size:12.5px;color:var(--n-500);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tdstat{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tst{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;background:var(--n-100);color:var(--n-600);font-size:12px;font-weight:600}
.tst.ok{background:var(--ok-bg);color:var(--ok)} .tst.bad{background:var(--bad-bg);color:var(--bad)} .tst.warn{background:var(--warn-bg);color:var(--warn)}
.tdsnooze{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--n-600)}
.tdbtns{display:flex;gap:4px}
.tdbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--n-200);background:var(--n-0);color:var(--n-600);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.tdbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdbtn:hover{background:var(--n-50);color:var(--n-900)}
.tdcheck:hover{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .tdcheck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tdempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 10px 10px;color:var(--n-600);font-size:13.5px}
.tdempty svg{width:120px;height:90px} .tdempty b{color:var(--n-900);font-size:15px} .tdempty .btn{margin-top:6px}
.tdnone{margin:10px 4px}
@media (max-width:560px){ .tditem{grid-template-columns:50px minmax(0,1fr);gap:10px} .tdbtns{grid-column:1 / -1;justify-content:flex-end} .tdtile{min-height:58px} .tdd{font-size:18px} }
/* ── account notes ── */
body .notecell{background:var(--n-0);border:1px dashed var(--n-300);border-radius:var(--r-sm);padding:4px 8px;font:inherit;font-size:12.5px;color:var(--n-700);text-align:left;max-width:320px;white-space:normal;cursor:pointer;line-height:1.35}
body .notecell:hover{border-color:var(--b-500);background:var(--b-50)}

body .notecell.inline{max-width:100%}
body #anText{width:100%;min-height:120px;resize:vertical}
/* ── tables ── */
body .tw{border-radius:0 0 var(--r-xl) var(--r-xl)}
body table th{background:var(--n-50)!important;color:var(--n-500)!important;font-size:11.5px!important;font-weight:650!important;text-transform:uppercase;letter-spacing:.04em;border-color:var(--n-200)!important}
body table td{border-color:var(--n-100)!important;color:var(--n-700);font-size:13.5px}
body table tbody tr{transition:background var(--t-fast) var(--ease)}
body table tbody tr:hover td{background:var(--n-25)}
body td.z,body td .z{color:var(--n-450)!important;font-weight:500!important}
body .pct{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:24px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
body .pct.hi{background:var(--ok-bg)!important;color:var(--ok)!important}
body .pct.mid{background:var(--warn-bg)!important;color:var(--warn)!important}
body .pct.lo{background:var(--bad-bg)!important;color:var(--bad)!important}
body .pct.na{background:transparent!important;color:var(--n-400)!important;font-weight:500}

body table.cov th,body table.cov td{padding:9px 10px!important}
body table.cov td:first-child,body table.cov th:first-child{position:sticky;left:0;z-index:1;background:var(--n-0)}
body table.cov thead th:first-child{background:var(--n-50)!important;z-index:2}
body table.cov tbody tr:hover td:first-child{background:var(--n-25)}

/* ── charts ── */
body .card.chart .ch h3{font-size:15px;font-weight:650}
body .card.chart .ch p{color:var(--n-500);font-size:12.5px}

/* ── log: greeting, day strip, day pill, visit rows, actions ── */
body .logcard .hello,body .logcard>.head{background:linear-gradient(180deg,var(--b-50),var(--n-0))!important;border-bottom:1px solid var(--n-100)}
body .wd{border:1px solid var(--n-200)!important;border-radius:var(--r-lg)!important;background:var(--n-0)!important;box-shadow:none!important;transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
body .wd:hover{border-color:var(--b-200)!important;transform:translateY(-1px)}
body .wstrip{flex-wrap:nowrap!important}
body .wd{min-width:50px;height:60px;box-shadow:none!important}
body .wd .dn{font-size:10.5px;font-weight:650;color:var(--n-500);letter-spacing:.05em}
body .wd .dd{font-size:16px;font-weight:700;color:var(--n-900)}
body .wd .dc{font-size:10px;font-weight:700;color:var(--ok)}
body .wd.on{background:var(--n-0)!important;border-color:var(--n-200)!important}

body .dp:hover{background:var(--b-100)!important}
body .ordhint{background:var(--n-50);border:1px solid var(--n-200);color:var(--n-600);border-radius:var(--r-md)}

body .line .ord select,body .seq{background:var(--b-600)!important;box-shadow:0 1px 2px rgba(59,73,214,.3)!important}

body .uchip{border:1px solid var(--n-200)!important;border-radius:999px!important;background:var(--n-0)!important;transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}

body .post{border:1px solid var(--n-200)!important;border-radius:var(--r-lg)!important;box-shadow:var(--sh-xs)!important;background:var(--n-0)}

body .modal{background:rgba(15,22,41,.42)!important;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
body .modal .dialog{border-radius:var(--r-xl)!important;box-shadow:var(--sh-lg)!important;border:1px solid var(--n-200)}

body .tabbar{background:rgba(255,255,255,.92)!important;backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--n-200)!important}

  body .card.gauge>*:not(.gl):not(.ring):nth-last-child(2){align-self:end}

/* the visits trend sits under the figures on narrow cards instead of over the text */

/* ═══════════════════════════════════════════════════════════════════════════ */

/* ════════════════════════════ 2026 refresh (21 Oct) ════════════════════════════
   Same brand (TMC navy + leaf green, colour only for meaning), refined: Plus Jakarta Sans, calmer surfaces,
   bolder figures, softer depth, quicker feedback. Heavy blur effects are dropped on phones so scrolling stays smooth
   on mid-range Android. Display fixes for phones are at the end of this block. */
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --n-50:#F4F6FB; --n-25:#FAFBFE; --n-100:#EDF0F7; --n-200:#E3E7F0; --n-300:#D2D8E5;
  --r-md:11px; --r-lg:16px; --r-xl:20px;
  --sh-xs:0 1px 2px rgba(16,24,64,.05);
  --sh-sm:0 1px 2px rgba(16,24,64,.04),0 6px 18px -6px rgba(16,24,64,.08);
  --sh-md:0 2px 6px rgba(16,24,64,.05),0 14px 32px -10px rgba(16,24,64,.16);
  --sh-lg:0 4px 10px rgba(16,24,64,.06),0 28px 64px -12px rgba(16,24,64,.28);
  --ease:cubic-bezier(.22,.9,.24,1); --t-fast:110ms; --t:170ms;
  --ring:0 0 0 3px rgba(59,73,214,.24);
  --primary-grad:linear-gradient(180deg,#4654E0,#3442C9);
}
html body,body .msg,body input,body select,body textarea,body button{font-family:var(--font)}
html body{background:var(--n-50);font-size:14px;letter-spacing:-.003em;-webkit-tap-highlight-color:transparent}
body button,body a,body [role=button],body .wd,body .uchip,body .story,body .chipq,body .tdtab{touch-action:manipulation}
body h1,body h2,body h3{font-weight:700;letter-spacing:-.02em}
body .card .head h2,body .card.chart .ch h3{font-weight:700;letter-spacing:-.015em}

/* cards: lighter edges, softer depth */
body .card,body .kpi,body .fbar{border-color:var(--n-200)!important;box-shadow:var(--sh-sm)!important}
@media (hover:hover){ body .drillable:hover,body .kpi:hover{box-shadow:var(--sh-md)!important;transform:translateY(-2px)} }
body .drillable:active{transform:translateY(0) scale(.99)}

/* figures: the number is the hero */
body .kpi .l{font-size:12.5px!important;color:var(--n-500)!important;font-weight:600!important}
body .kpi .v{font-size:32px!important;font-weight:800!important;letter-spacing:-.04em!important}
body .kpi .d{color:var(--n-500)!important}
body .kpi .ki{border-radius:12px!important}
body .card.gauge{background:radial-gradient(130% 100% at 0% 0%,#2E3A9E 0%,#1A2263 45%,var(--b-950) 100%)!important}
body .card.gauge .rv{font-weight:800!important;letter-spacing:-.04em}

/* buttons: one confident primary, quiet everything else, a small press response */
body .btn{border-radius:12px!important;font-weight:650}
body .btn.primary{background:var(--primary-grad)!important;border-color:#3442C9!important;box-shadow:0 1px 2px rgba(52,66,201,.3),0 6px 16px -6px rgba(52,66,201,.55),inset 0 1px 0 rgba(255,255,255,.16)!important}
body .btn.primary:hover{background:linear-gradient(180deg,#3E4CD6,#2D3BB5)!important}
body .btn:active:not(:disabled),body .tdbtn:active,body .ib:active,body .chipq:active,body .uchip:active{transform:scale(.97)}
body .btn.sm{border-radius:10px!important}

/* inputs: roomier, clearer focus */
body input:not([type=checkbox]):not([type=radio]):not([type=file]),body select{min-height:42px}
body input[type=text],body input[type=search],body input[type=email],body input[type=tel],body input[type=password],body input[type=number],body input[type=date],body input[type=month],body input:not([type]),body select,body textarea{border-radius:12px!important;background-color:var(--n-0)}
body input::placeholder,body textarea::placeholder{color:var(--n-450)}

/* header: brand navy, a hairline of leaf green under it */
body header{background:linear-gradient(180deg,#151C52,#1B2463)!important;box-shadow:0 1px 0 rgba(76,191,107,.35),0 8px 24px -8px rgba(14,20,64,.45)!important}

/* log page */
body .logcard .hello,body .logcard>.head{background:radial-gradient(120% 140% at 0% 0%,#E9ECFD 0%,#F5F6FE 45%,var(--n-0) 100%)!important}
body .wd{border-radius:14px!important}
body .wd.sel{background:var(--b-600)!important;border-color:var(--b-600)!important;box-shadow:0 6px 14px -6px rgba(59,73,214,.6)!important}
body .wd.sel .dn,body .wd.sel .dd,body .wd.sel .dc{color:#fff!important}
body .wd.sel .dc::before{background:#fff!important}
body .line{border-radius:16px!important}
body .post{border-radius:18px!important;box-shadow:var(--sh-sm)!important}
body .post .ph .pmeta b{color:var(--b-700)}

/* to-do */
body .tditem{border-radius:16px}
body .tdtile{border-radius:12px}
body .tst{height:auto;min-height:22px;padding:3px 9px;line-height:1.3}

/* dashboard */
body .story .av,body .story img.av{transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}
body .seg button.on{color:var(--b-700);font-weight:700}
body table th{font-size:11px!important;letter-spacing:.05em}

/* dialogs and toasts: a short, soft entrance */
body .modal.open .dialog{animation:dlgin .2s var(--ease) both}
body .modal .dialog:focus{outline:none;box-shadow:var(--sh-lg)!important}
@keyframes dlgin{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
body #toast{border-radius:14px!important;font-weight:550}

/* switching tabs: the new page eases in instead of jumping */
#v-log,#v-dash{animation:viewin .22s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* smooth on long pages: off-screen day cards are not painted until scrolled near (charts must stay laid out to draw) */

async function parseApi(resp){

}

function attachPicker(inp, menu, ae, accts, onPick){
  let active = 0, opts = [], strongTop = false;
  const build = () => {
    const raw = inp.value.trim(), q = norm(raw); opts = [];

      strongTop = ranked.length && ranked[0].s >= 0.6;

    menu.classList.toggle('open', !!html);

  };
  const paint = () => $$('.opt', menu).forEach((o,i)=>o.classList.toggle('active', i===active));
  const pick = (v, isNew) => {
    v = String(v || '').trim().replace(/\s+/g, ' ').slice(0, 120);

    const typed = inp.value.trim();

  };
}

function planSuggestion(skip){

  const today = todayIso(), cov = coverageFor(ui.me, today.slice(0, 7) + '-01', today), spots = companySpots(), idx = visitDatesFor(ui.me);
  const due = cov.accts.filter(x => !x.cur.met && x.cur.open && !(skip && skip.has(canon(x.a.account)))).map(x => { const s = spots.get(canon(x.a.account)), ds = [...(idx.get(canon(x.a.account)) || [])].sort(); return {x, s, last: ds[ds.length - 1] || ''}; }).filter(y => y.s);
  if (!due.length) return null;
  due.sort((p, q) => p.x.tier.localeCompare(q.x.tier) || (p.last || '0').localeCompare(q.last || '0'));
  const seed = due[0], near = due.slice(1).map(y => Object.assign(y, {km: distKm(seed.s.lat, seed.s.lng, y.s.lat, y.s.lng)})).filter(y => y.km <= 10).sort((p, q) => p.km - q.km).slice(0, 4);
  const stops = [seed, ...near], office = (data.settings.offices || {})[aeCities(ui.me)[0] || ''], o = office && (office.latlng || office.address);
  const url = 'https://www.google.com/maps/dir/?api=1' + (o ? '&origin=' + encodeURIComponent(o) + '&destination=' + encodeURIComponent(o) : '&destination=' + stops[stops.length - 1].s.lat + ',' + stops[stops.length - 1].s.lng) + '&waypoints=' + encodeURIComponent(stops.map(y => y.s.lat + ',' + y.s.lng).join('|')) + '&travelmode=driving';
  return {stops, url, left: due.length};
}

// Square-crop and shrink a photo to a ~6 KB JPEG data URL so it fits comfortably in a sheet cell.
function shrinkPhoto(file){
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { try { const S = 112, c = document.createElement('canvas'); c.width = S; c.height = S; const x = c.getContext('2d'); const m = Math.min(img.width, img.height); x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S); let q = 0.82, out = c.toDataURL('image/jpeg', q); while (out.length > 12000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); } URL.revokeObjectURL(url); resolve(out); } catch(e) { reject(e); } };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

// A fenced ```json {...}``` block at the end of a reply is an action for the app; the rest is what the person reads.
function aiParse(reply){

  if (m) { try { action = JSON.parse(m[1]); text = (reply.slice(0, m.index) + reply.slice(m.index + m[0].length)).trim(); } catch(e) { action = null; } }
  return {text, action};
}

// Admin → Kilometres & maps → "Locate missing accounts": pins accounts on Google Maps in batches (the backend does up
// to 40 per call to stay inside Apps Script's time limit) until none are left or nothing more can be found.
async function locateAccounts(ids, btnSel){
  const btn = $(btnSel || '#mLocate'), label = btn ? btn.textContent : '';
  if (btn) btn.disabled = true;
  let found = 0, missing = 0;
  try {
    for (let round = 0, retry = false; round < 20; round++) {
      if (btn) btn.textContent = `Locating… ${found} pinned so far`;
      const r = await callApi({action:'locateAccounts', ids: ids || [], limit: 40, retry, adminPin: getAdminPin()});
      const res = r.results || [];
      if (!res.length && !retry && !(ids && ids.length)) { retry = true; continue; }   // then give earlier "not found" ones one more try (with the owner's city)
      res.forEach(x => { const a = data.accounts.find(y => y.id === x.id); if (a) { if (x.lat !== undefined) { a.lat = x.lat; a.lng = x.lng; } a.located = x.located; } });
      found += res.filter(x => x.lat !== undefined).length; missing += res.filter(x => /^NOT FOUND/.test(x.located || '')).length;
      if (!res.length || (ids && ids.length)) break;
    }
    resetMatchCache();
    toast(found || missing ? `${found} account${found===1?'':'s'} pinned${missing ? ` · ${missing} not found by name — add a street address in the Accounts tab` : ''}` : 'Every account is already on the map');
  } catch(e) { toast(found ? `${found} pinned, then: ${friendly(e)} — tap again to continue` : friendly(e)); }
  finally { if (btn) { btn.disabled = false; btn.textContent = label; } if ($('#modal').classList.contains('open') && ui.mgrTab === 'km') settingsDialog('km'); if (ui.tab === 'dash' && ui.dashSec === 'map') { ui.mapView = null; render(); } }
}

/* ---------- Data check: what is really in the sheet, what each number means, and one-tap fixes ---------- */
function dataAudit(){

  const bookDup = []; const seen = new Map(); data.accounts.forEach(a => { const k = a.ae + '|' + norm(a.account); seen.set(k, (seen.get(k)||[]).concat(a)); }); seen.forEach(list => { if (list.length > 1) bookDup.push(list); });
  const kmCheck = rows.filter(v => splitAccts(v.accounts).length && (v.kmMode === 'pending' || Number(v.km) > 300 || (v.kmMode === 'auto' && (dayDetails(v).some(d => areaPin(d.lat, d.lng)) || String(v.route || '').includes('→')))));
  const strangers = rows.filter(v => !team.has(v.ae));
  const future = rows.filter(v => v.date > todayIso());
  const unmatched = new Map(); rows.forEach(v => splitAccts(v.accounts).forEach(n => { if (!accountRow(v.ae, n) && !accountRow('', n)) unmatched.set(canon(n), n); }));
  const byDay = new Map(); rows.forEach(v => { const k = v.ae + '|' + v.date; byDay.set(k, (byDay.get(k) || []).concat(v)); });
  const splitDays = [...byDay.values()].filter(l => l.length > 1);

}

      ${issue(a.catConflict.length, 'The same account twice in one person’s list with different categories', a.catConflict.slice(0,10).map(x => `${esc(x.ae)}: ${esc(x.name)} — ${[...x.cats].sort().join(' and ')} → counted as <b>${[...x.cats].sort()[0]}</b>`).join('<br>') + '<br><span class="hint">Keep one row per account for each person in the Categories tab.</span>', '')}
      ${(() => { let cs = {}; try { cs = JSON.parse(data.settings.categoriesSync||'{}'); } catch(e){} const un = cs.unreadCategories || {}, n = Object.values(un).reduce((s,x)=>s+x,0); return issue(n, 'Categories tab: category values the app can’t read', Object.entries(un).slice(0,8).map(([v,c]) => `“${esc(v)}” ×${c}`).join(', ') + '<br><span class="hint">Use A, B or C (also fine: “Cat A”, “Category B”, “Tier C”). Blank or “None” means no category.</span>', ''); })()}
      ${issue((() => { let cs = {}; try { cs = JSON.parse(data.settings.categoriesSync||'{}'); } catch(e){} return (cs.unknownAEs||[]).length; })(), 'Categories tab: names that don’t match anyone on the team', (() => { let cs = {}; try { cs = JSON.parse(data.settings.categoriesSync||'{}'); } catch(e){} return (cs.unknownAEs||[]).map(esc).join(', ') + '<br><span class="hint">Those rows aren’t in anyone’s book. Fix the spelling in the Categories tab, or add the person in Settings → Team.</span>'; })(), '')}
      ${issue(a.strangers.length, 'Visits by people who aren’t on the team (left out of every figure)', [...new Set(a.strangers.map(v => v.ae))].map(esc).join(', '), '')}
      ${issue(a.future.length, 'Visits dated in the future', a.future.slice(0,6).map(v => `${esc(v.date)} · ${esc(v.ae)}`).join('<br>'), '')}
      <div class="dc-issue info"><div class="dc-h"><span class="dc-n">${a.unmatched.size}</span><b>Clients not in anyone’s book</b></div><div class="dc-b">${[...a.unmatched.values()].slice(0,12).map(esc).join(', ')}${a.unmatched.size > 12 ? ', …' : ''}<br><span class="hint">They count as net-new visits. If one is really an existing account under another spelling, add the spelling in the <b>Aliases</b> tab.</span></div></div>
      <details class="dc-def"><summary>How each number is worked out</summary><ul>
        <li><b>Visits</b> — every client listed on a day, for the people and dates selected.</li>
        <li><b>Visit days</b> — days with at least one visit, counted per person (two people on the same date = 2). <b>Dates</b> — different calendar dates.</li>
        <li><b>Accounts visited</b> — different accounts each person visited (spellings and aliases of the same account count once).</li>
        <li><b>Coverage</b> — each account must meet its rule in every calendar period: <b>A</b> 2 visits every month, <b>B</b> 1 visit every month, <b>C</b> 1 visit every quarter — in a month, the target is the C accounts not yet visited this quarter ÷ the months left, rounded up to whole visits (15 C → 5; none visited → 8; none again → 15), each C account counted once. Dormant accounts are not counted. Each account × period is one requirement; coverage = requirements met ÷ requirements due. Categories are per person: an account’s category for someone is the one on their own row of the Categories tab (blank = no category for them, even if a colleague has the same company as A). Each person’s coverage counts only their own visits, dated today or earlier, to accounts in their own book (any spelling or alias); the same account twice on one day counts once. When two people visit together, each logs it — it counts for whoever has the account in their book. The team total adds up everyone’s requirements. Accounts added part-way through a period count from the next full period. Months and quarters that ended before the first visit logged in the app aren’t judged (there is no data for them). People marked “no fixed book” and admins without visits are left out.</li>
        <li><b>Net new</b> — companies that are in nobody’s Categories list (new to TMC), visited in the period.</li>
        <li><b>Kilometres</b> — the day totals saved with each day (Google Maps or entered by hand); <b>per visit</b> = km ÷ visits.</li>
      </ul></details>
    </div>`, null, 'Close');
  $$('button[data-fix]').forEach(b => b.onclick = () => dataFix(b.dataset.fix, b));
}
async function dataFix(kind, btn){
  const a = dataAudit(); btn.disabled = true; let done = 0, failed = 0;
  if (kind === 'merge') {
    if (!(await confirmModal(`Merge ${a.splitDays.length} split day${a.splitDays.length===1?'':'s'}?`, 'Each day becomes one row with all its visits (each client once), and its kilometres are worked out again for the whole day.', 'Merge'))) { btn.disabled = false; return; }
    for (const l of a.splitDays) {
      btn.textContent = `Merging ${done + failed + 1} of ${a.splitDays.length}…`;
      try {
        const keep = l[0], add = l.slice(1).flatMap(v => dayDetails(v));
        const r = await callApi({action:'upsertVisit', row:{...keep}, mode:'append', add, autoKm: String(data.settings.autoKm||'Y').toUpperCase() !== 'N', adminPin:getAdminPin()});
        upsertLocal('visits', normVisits([r.row])[0]);
        for (const v of l.slice(1)) { await callApi({action:'deleteVisit', id: v.id, adminPin:getAdminPin()}); removeLocal('visits', v.id); }
        done++;
      } catch(e) { failed++; }
    }
    toast(`${done} day${done===1?'':'s'} merged${failed ? ` · ${failed} couldn’t be merged` : ''}`); render(); dataCheckDialog(); return;
  }
  const list = kind === 'repeats' ? a.repeats.map(x => x.v) : kind === 'recount' ? a.miscount : a.kmCheck;
  if (kind === 'km' && (ui.backendV || 0) < NEEDS_BACKEND) { toast(`Nothing changed: the server is still the old version${ui.backendV ? ' (v' + ui.backendV + ')' : ''}. Deploy the new Code.gs first — then Fix recalculates every day as 2 × office → each client.`); return; }
  if (!(await confirmModal(kind === 'repeats' ? `Remove ${a.repeats.reduce((s,x)=>s+x.extra,0)} repeated visits?` : kind === 'recount' ? `Recount ${list.length} days?` : `Recalculate kilometres for ${list.length} days?`,
      kind === 'repeats' ? 'On each affected day the client is kept once (the first time it appears); that day’s kilometres are recalculated.' : kind === 'recount' ? 'Each day’s visit count is set to the number of clients actually listed.' : 'Kilometres are worked out again from Google Maps: 2 × office → each client.', 'Go ahead'))) { btn.disabled = false; return; }
  for (const v of list) {
    btn.textContent = `Fixing ${done + failed + 1} of ${list.length}…`;
    try {
      let row = {...v}, autoKm = false;
      if (kind === 'repeats') { const seen = new Set(); const det = dayDetails(v).filter(d => { const k = canon(d.client); if (seen.has(k)) return false; seen.add(k); return true; }); row.details = JSON.stringify(det); row.accounts = det.map(d => d.client).join('; '); row.count = det.length; autoKm = String(data.settings.autoKm||'Y').toUpperCase() !== 'N'; }
      if (kind === 'recount') row.count = splitAccts(v.accounts).length;
      if (kind === 'km') { const r = await callApi({action:'recalcKm', id: v.id, adminPin:getAdminPin()}); upsertLocal('visits', normVisits([r.row])[0]); done++; continue; }
      const r = await callApi({action:'upsertVisit', row, autoKm, adminPin:getAdminPin(), mode:'replace', baseTs: v.ts || ''}); upsertLocal('visits', normVisits([r.row])[0]); done++;
    } catch(e) { failed++; }
  }
  toast(`${done} day${done===1?'':'s'} fixed${failed ? ` · ${failed} couldn’t be fixed` : ''}`); render(); dataCheckDialog();
}

/* ---------- Modal / toast ---------- */
// bodyHtml is built by the app itself; every value it interpolates is passed through esc() first.
let modalGen = 0;
function openModal(title, bodyHtml, onSave, saveLabel='Save'){
  const myGen = ++modalGen;
  $('#mTitle').textContent = title; $('#mBody').innerHTML = bodyHtml; $('#modal .dialog').classList.remove('wide');
  $('#mFoot').innerHTML = onSave ? `<span class="hint" id="mErr" style="margin-right:auto"></span><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mSave">${saveLabel}</button>` : `<span class="hint" id="mErr" style="margin-right:auto"></span><button class="btn primary" id="mCancel">${saveLabel}</button>`;
  const m = $('#modal'); m.classList.add('open');
  const close = () => m.classList.remove('open');
  $('#mCancel').onclick = close;
  m.onclick = e => { if (e.target===m) close(); };
  if ($('#mSave')) $('#mSave').onclick = async () => { const b=$('#mSave'); b.disabled=true; $('#mErr').textContent=''; try { await onSave(); if (modalGen === myGen) close(); } catch(e){ if (modalGen === myGen) $('#mErr').textContent = e.message; } b.disabled=false; };
  const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;   // phones: no keyboard popping up before the dialog is read
  const first = $('#mBody input, #mBody select, #mBody textarea'); if (first && title !== 'Settings' && !touch) first.focus();
}
let toastT;
function toast(msg, actLabel, act){
  ui.lastToast = Date.now();
  const t=$('#toast'), a=$('#toastAct'); $('#toastMsg').textContent = msg;
  a.style.display = actLabel ? '' : 'none'; a.textContent = actLabel||''; a.onclick = async () => { t.classList.remove('show'); try { await act(); } catch(e){ toast(e.message); } };
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), actLabel ? 10000 : 3500);
}

/* ============================ INIT ============================ */
function initMeSelect(){
  setHeaderAvatar();
  const meSel = $('#me');
  if (!ui.demo && ui.session) { meSel.innerHTML = `<option>${esc(ui.me)}</option>`; meSel.disabled = true; meSel.title = 'Signed in as ' + ui.me + (isMgr() ? ' (admin)' : ''); meSel.classList.add('locked'); return; }
  if (!activeAEs().some(a=>a.name===ui.me)) ui.me='';
  meSel.innerHTML = '<option value="">Select AE…</option>' + activeAEs().map(a=>`<option ${a.name===ui.me?'selected':''}>${esc(a.name)}</option>`).join('');
}
function initUi(){
  $('#loading').style.display = 'none'; const sk = $('#skeleton'); if (sk) sk.remove();   // data is in: hide the card on every sign-in, not only the first
  if (ui.uiReady) { initMeSelect(); return; }   // handlers and timers are set up once (the instant start may call this first)
  ui.uiReady = true;
  // month: current, or the latest month with data
  const cur = todayIso().slice(0,7);
  const months = [...new Set(data.visits.map(v=>monthOf(v.date)))].sort();
  ui.month = localStorage.getItem('vi.month') || (months.includes(cur) ? cur : (months[months.length-1] || cur));
  try { const saved = JSON.parse(localStorage.getItem('vi.range')||''); if (saved && saved.preset) setRange(saved.preset, saved.from, saved.to); } catch(e){}
  if (!localStorage.getItem('vi.range')) { if (months.includes(cur)) setRange('month'); else if (months.length) { const lm = months[months.length-1]; setRange('custom', lm+'-01', monthEnd(lm)); } else setRange('month'); }
  initMeSelect();
  document.addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key==='Enter' && ui.tab==='log' && $('#fSave') && !$('#modal').classList.contains('open')) { e.preventDefault(); $('#fSave').click(); } });
  // Unsaved visits must survive neither a stray refresh nor a closed tab unnoticed.
  window.addEventListener('beforeunload', e => {
    const dirty = (form && !form.editId && form.lines.some(l => l.client));
    if (!dirty) return;
    e.preventDefault(); e.returnValue = '';
  });
  // Tell people plainly when the connection drops, instead of failing silently on the next save.
  window.addEventListener('offline', () => { if (!ui.demo) { setConn('err', 'Offline'); document.body.classList.add('is-offline'); } });
if (navigator.onLine === false && !ui.demo) document.body.classList.add('is-offline');   // opened without signal
  window.addEventListener('online', async () => {
  document.body.classList.remove('is-offline');
    if (ui.demo || document.body.classList.contains('signed-out')) return; setConn('', 'Reconnecting'); await load(false);
    // anything that failed to save while offline goes out now, automatically
    try { if (ui.me && localStorage.getItem('vi.outbox.'+ui.me) && form && !form.editId && form.lines.some(l => l.client)) { localStorage.removeItem('vi.outbox.'+ui.me); toast('Back online — sending your saved visits…'); ui.tab = 'log'; render(); await saveVisit(); } } catch(e){}
  });
  $('#me').onchange = e => { ui.me = e.target.value; localStorage.setItem('vi.me', ui.me); form = null; ui.route = null; render(); };
  $$('#nav button').forEach(b => b.onclick = () => goTab(b.dataset.tab));
  if ($('#hGo')) $('#hGo').onclick = () => ai.open ? aiCloseFn() : aiOpen();
  if ($('#hav')) $('#hav').onclick = () => goTab('menu');
  $$('#tabbar button[data-tab]').forEach(b => b.onclick = () => goTab(b.dataset.tab));
  $('#tabbar button[data-go]').onclick = () => ai.open ? aiCloseFn() : aiOpen();
  $('#btnSettings').onclick = () => goTab('menu');
  $('#hInstall').onclick = installApp;
  // while any dialog is open, the phone tab bar steps aside so Save / Cancel are always reachable
  const syncModal = () => { document.body.classList.toggle('modal-open', $$('.modal').some(m => m.classList.contains('open'))); overlayChanged(); $$('.modal').forEach(dialogFocus); };
  $$('.modal').forEach(m => new MutationObserver(syncModal).observe(m, {attributes:true, attributeFilter:['class']}));
  if ($('#ai')) new MutationObserver(overlayChanged).observe($('#ai'), {attributes:true, attributeFilter:['class']});
  // opening the app at #dashboard or #log starts on that tab
  { const h = hashTab(location.hash); if (h) { ui.tab = h; try { localStorage.setItem('vi.tab', h); } catch(e){} } }
  initAi();
  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'') || (e.target && e.target.isContentEditable);
    if (document.body.classList.contains('signed-out')) return;
    if (typing || e.metaKey || e.ctrlKey || e.altKey || $('#modal').classList.contains('open') || $('#ask').classList.contains('open')) return;
    const go = tab => { ui.tab = tab; localStorage.setItem('vi.tab', tab); countUpArmed = true; render(); };
    if (e.key === 'l') { go('log'); setTimeout(() => { const i = $('#v-log input[id^="lin-"]'); if (i) i.focus(); }, 50); e.preventDefault(); }
    else if (e.key === 'd') { go('dash'); e.preventDefault(); }
    else if (e.key === '/' || e.key === 'g') { ai.open ? $('#aiIn').focus() : aiOpen(); e.preventDefault(); }
    else if (e.key === 'n' && ui.tab === 'log' && $('#fAdd')) { $('#fAdd').click(); e.preventDefault(); }
    else if (e.key === '?') { openModal('Keyboard shortcuts', `<div class="keys">${[['L','Log a visit'],['D','Dashboard'],['N','Another visit line'],['/ or G','Talk to Go'],['Ctrl + Enter','Save visits'],['Esc','Close a panel'],['?','This list']].map(([k,v]) => `<div><kbd>${k}</kbd><span>${v}</span></div>`).join('')}</div>`, null, 'Close'); e.preventDefault(); }
  });
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('#ask').classList.contains('open')) return; /* the confirmation closes itself — only the top dialog */ if ($('#modal').classList.contains('open')) { $('#modal').classList.remove('open'); return; } if (ai.open) aiCloseFn(); });
  // Pull down at the top of a page to refresh, as in Facebook/Instagram (phones; the browser's own pull-to-reload is switched off)
  if (!ui.demo) {
    const ptr = document.createElement('div'); ptr.className = 'ptr'; ptr.setAttribute('aria-hidden', 'true'); ptr.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>'; document.body.appendChild(ptr);
    let y0 = null, pulled = 0;
    document.addEventListener('touchstart', e => { y0 = (window.scrollY <= 0 && e.touches.length === 1 && !document.querySelector('.modal.open') && !ai.open && !document.body.classList.contains('signed-out')) ? e.touches[0].clientY : null; pulled = 0; }, {passive: true});
    document.addEventListener('touchmove', e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy <= 0 || window.scrollY > 0) { pulled = 0; ptr.classList.remove('on', 'ready'); ptr.style.transform = ''; return; } pulled = Math.min(dy, 140); ptr.classList.add('on'); ptr.classList.toggle('ready', pulled > 90); ptr.style.transform = `translate(-50%, ${pulled * 0.55}px) rotate(${pulled * 2.4}deg)`; }, {passive: true});
    document.addEventListener('touchend', async () => { if (y0 == null) return; y0 = null; const go = pulled > 90; pulled = 0;
      if (!go) { ptr.classList.remove('on', 'ready'); ptr.style.transform = ''; return; }
      ptr.classList.add('spin'); ptr.style.transform = 'translate(-50%, 50px)'; try { navigator.vibrate && navigator.vibrate(8); } catch(e){}
      try { await load(false); } catch(e){}
      ptr.classList.remove('on', 'ready', 'spin'); ptr.style.transform = ''; }, {passive: true});
  }
  if (!ui.demo) {
    let tick = 0;
    setInterval(() => {
      tick++;
      const dashDue = ui.tab==='dash' && tick % 2 === 0;           // dashboard: every 30 s
      const logDue = ui.tab!=='dash' && tick % 4 === 0;            // log tab: every 60 s, only when not mid-entry
      const typing = (() => { const a = document.activeElement; if (a && a.closest && a.closest('#v-log') && a.matches('input,select,textarea')) return true; return $$('#v-log input[id^="lin-"]').some(i => i.value.trim()); })();
      const idle = !typing && (!form || !form.lines.some(l => l.client));   // an open edit counts as busy too
      if (document.hidden || $('#modal').classList.contains('open') || document.body.classList.contains('signed-out')) return;
      if (dashDue || (logDue && idle)) load(false);
    }, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.tab==='dash' && !document.body.classList.contains('signed-out')) load(false); });
  }
}
